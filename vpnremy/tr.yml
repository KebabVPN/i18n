  referral_v2_inactive:
    text: |
      *💰 Referans*

      Ortaklık programı ilk ödemenizden sonra açılır. Davet bağlantınız o zaman burada ve kişisel hesabınızda görünecek.
  # --------------------------------------------------------
  promo_templates:
    text: |
      *🎟 Promosyon kodları*

      Yeni kodlar için bir kampanya seçin:
  # --------------------------------------------------------
  promo_templates_empty:

vpnremy_tr:
  welcome:
    text: |
      *%<title>s*

      %<trial>s deneme erişimi *%<exp>s* tarihine kadar geçerlidir.

      Bağlanmak istediğiniz ülkeyi seçin:
  menu:
    back: ⬅️ Geri
    home: 🏠 Ana Menü
    home_short: 🏠 Ana Sayfa
    config: ⚙️ Konfigürasyonlar
    subscription: 💸 Abonelik
    subscription_back: 💸 Aboneliğe Geri
    subscription_back_short: 💸 Geri Dön
    lang: 🌎 Dil
    lang_back: 🌎 Dillere Geri Dön
    lang_custom: 🔧 Yeni Dil
    help: ℹ️ Yardım
    delete_message: 🥷 Mesajı Sil
    settings: 🔧 Ayarlar
    settings_notifications_enable: 🔕 Bildirimleri Etkinleştir
    settings_notifications_disable: 🔔 Bildirimleri Devre Dışı Bırak
    subscription_management_stripe: 💸 Abonelik (Stripe)
    referral: 💰 Referans
    cabinet: 👤 Kişisel hesap
    cabinet_open: 🔐 Hesabınıza giriş yapın
    promo_generate: 🎟 Promosyon kodu oluştur
    promo_enter: 🎟 Promosyon kodu gir
    platform_apple:  Apple (iOS, MacOS)
    platform_android: 📱 Android
    platform_custom: 🔑 Diğer
  # --------------------------------------------------------
  platforms:
    text: |
      *Platformunuzu Seçin:*

      Kurmak istediğiniz işletim sistemini seçin. Kullanmanız gereken kimlik bilgileri ve yapılandırma dosyalarını alacaksınız. Lütfen dikkatli olun, hassas bilgiler görüntülenebilir.
  # --------------------------------------------------------
  help:
    text: |
      *Kullanılabilir Komutlar:*

      🏠 /start - Botu başlatın ve kaydolun

      ⚙️ /config - Yapılandırmaları yönetin

      💸 /subscription - Aboneliğinizi yönetin

      🌎 /lang - Bot dilini yönetin

      🔧 /settings - Ayarları yönetin

      ℹ️ /help - Komut listesini alın

      🤖 @vpnremy\_support\_bot - Destek alın
  # --------------------------------------------------------
  start:
    text: |
      *🌟 Hoş geldiniz! 🌟*

      [VPNRemy](https://vpnremy.com) seçtiğiniz için teşekkür ederiz. VPN kullanmaya başlamak için aşağıdaki *Konfigürasyonlar* düğmesine basmanız ve cihazınıza kurmanız gereken yapılandırma dosyasını almanız gerekiyor. Ayrıntılı kılavuz https://vpnremy.com adresinde bulunmaktadır. Tüm seçenekler, /help komutunu çalıştırarak kullanılabilir.
  # --------------------------------------------------------
  sub_extended:
    text: |
      🌟 *Tebrikler!* 🌟

      *%<days>s* gün VPN kullanımı kazandınız! Geri bildiriminizi @vpnremy\_support\_bot üzerinden bize yazmaktan çekinmeyin! 🫶

      Aboneliğiniz *%<exp>s* tarihinde sona eriyor.
  # --------------------------------------------------------
  sub_expired:
    text: |
      ❌ *Abonelik Süresi Doldu!* ❌

      Aboneliğinizin süresinin *%<exp>s* tarihinde dolduğunu üzülerek öğrendik.

      Hizmetleri kullanmaya devam etmek için /subscription komutunu izlemeniz gerekiyor.

      Herhangi bir sorunuz varsa lütfen bize @vpnremy\_support\_bot üzerinden yazın! 🫶
  # --------------------------------------------------------
  sub_expiring:
    text: |
      ⏰ *Aboneliğiniz yakında sona eriyor* ⏰

      Kalan gün: *%<days>s*. Aboneliğiniz *%<exp>s* tarihinde sona eriyor.

      VPN'i kesintisiz kullanmak için aboneliğinizi /subscription komutuyla yenileyin.

      Herhangi bir sorunuz varsa lütfen bize @vpnremy\_support\_bot üzerinden yazın! 🫶
  # --------------------------------------------------------
  subscription:
    ico_yes: ✅
    ico_no: ❌
    menu:
      crypto: USDT ile ödeme yapın (TRC-20, herhangi bir miktar)
      plan_1_mo: 💵 1 Ay - 299.00 RUB
      plan_6_mo: 💵 6 Ay - 1614.00 RUB
      plan_12_mo: 💵 12 Ay - 2988.00 RUB
    text: |
      *Aboneliğiniz:*

      Bitiş tarihi: *%<exp>s* %<ico>s (%<days>s aktif gün)
      Ödeme yaparak [Kullanım Koşulları](https://vpnremy.com/terms) ile anlaştığınızı kabul edersiniz.
  # --------------------------------------------------------
  payment_options:
    checkout_pending: "İlk ödeme indirimiyle açık bir ödemeniz var. Tarife veya ödeme yöntemini değiştirmek için süresinin dolmasını bekleyin."
    menu:
      pm_stripe_payment: 💳 Kart, WeChat, Alipay, ApplePay, GPay
      pm_stripe_subscription: 💳 Kart (abonelik)
      pm_pay2day: 🇷🇺 SBP (RUB)
    text: |
      *Aboneliğiniz:*

      Bitiş tarihi: *%<exp>s* %<ico>s (%<days>s aktif gün)
      Ödeme yaparak [Kullanım Koşulları](https://vpnremy.com/terms) ile anlaştığınızı kabul edersiniz.

      Satın alıyorsunuz: *%<description>s*

      Lütfen ödeme yöntemini seçin:
  # --------------------------------------------------------
  plan_unknown:
    text: |
      Plan devre dışı bırakıldı veya bilinmiyor! Satın alınabilir planları görmek için /subscription komutunu çalıştırın.
  # --------------------------------------------------------
  sub_crypto:
    text: |
      *TRC-20 adresinize yatırım yapın*:

      `%<addr_trc20>s`
      (kopyalamak için tıklayın)

      USDT yatırımları etkin fiyatlandırmaya göre USD olarak hesaplanır. Örneğin, 12 ay için ödeme yapmak istiyorsanız, sadece `49.99` USDT transfer edin. Herhangi bir miktarı transfer edebilirsiniz, abonelik bitiş tarihi bu oranda hesaplanacaktır.

      İşlemin işlenmesi için *20 onayı* bekliyoruz, bu nedenle bir süre beklemeniz gerekebilir. İşlem işlendikten sonra, yatırımınızın onayını içeren bir bildirim alacaksınız. Yatırımınız hesaba geçmezse, lütfen bize @Techru1 üzerinden yazın.
  # --------------------------------------------------------
  config:
    text: |
      *Konumunuzu Seçin:*

      Lütfen VPN yapılandırma dosyasını kurmak istediğiniz konumu seçin. Kullandığınız işletim sisteminden size sorulacaktır.
  # --------------------------------------------------------
  # The config file name, the same in the bot and in the cabinet (Host#config_file_name).
  onboarding:
    file: "VPNRemy-%<server>s"
    setup:
      ready: "Yapılandırma hazır"
      download: "Yapılandırmayı indir"
      back: "Başka bir cihaz seç"
      manual_title: "Bağlantı bilgileri"
      checks_title: "Bağlantı kurulmazsa"
      checks:
        - "Aboneliğinizin süresini, kullanıcı adını ve parolayı kontrol edin."
        - "Başka bir sunucu veya ağ deneyin."
        - "Cihazın tarih ve saatini kontrol edin; gerekirse profili yeniden yükleyin."
      confirmation: "İlk bağlantınızdan sonra bot onay gönderecek. Yardım için @vpnremy_support_bot hesabına yazın."
      iphone:
        title: "iPhone veya iPad ile bağlanma"
        steps:
          - "Yukarıdaki profili indirin. Açılmazsa Dosyalar'a kaydedip oradan açın."
          - "Ayarlar → İndirilen Profil'i açın. Görünmüyorsa Genel → VPN ve Aygıt Yönetimi'ne gidin."
          - "Yükle'ye dokunun ve cihaz parolanızı girin."
          - "Ayarlar → VPN bölümünde VPNRemy'yi açın."
      mac:
        title: "macOS ile bağlanma"
        steps:
          - "Yukarıdaki profili indirin ve dosyayı çift tıklayarak açın."
          - "Sistem Ayarları'nda Profiller'i bulun. Bölümün yeri macOS sürümüne göre değişir."
          - "VPNRemy profilini açın, Yükle'yi seçin ve Mac parolanızı girin."
          - "Sistem Ayarları → VPN bölümünde VPNRemy'yi açın."
      android:
        title: "Android ile bağlanma"
        steps:
          - "Google Play'den strongSwan VPN Client yükleyin: https://play.google.com/store/apps/details?id=org.strongswan.android"
          - "Yukarıdaki dosyayı indirin. strongSwan ile açın veya uygulama menüsünden VPN profilini içe aktar'ı seçin."
          - "İstenirse yapılandırma mesajındaki kullanıcı adını ve parolayı girin. İçe Aktar veya Kaydet'e dokunun."
          - "VPNRemy profiline dokunun ve VPN bağlantısına izin verin."
      custom:
        title: "Windows 10 veya 11 ile bağlanma"
        steps:
          - "Ayarlar → Ağ ve İnternet → VPN → VPN ekle yolunu açın."
          - "Sağlayıcı olarak Windows (yerleşik) seçin; ad olarak VPNRemy ve bağlantı bilgilerindeki sunucu adresini girin."
          - "VPN türü IKEv2, oturum açma türü kullanıcı adı ve parola olsun. Bilgileri girip kaydedin."
          - "VPNRemy'yi seçip Bağlan'a tıklayın."
      linux:
        title: "Linux ile bağlanma"
        steps:
          - "NetworkManager için strongSwan eklentisini yükleyin. Ubuntu ve Debian: sudo apt install network-manager-strongswan"
          - "Ayarlar → Ağ → VPN → + → IPsec/IKEv2 (strongswan) yolunu açın."
          - "Yukarıdaki sunucu adresini girin. Sertifika alanını boş bırakın."
          - "EAP kimlik doğrulamasını seçin, kullanıcı adı ve parolayı girin, İç IP adresi iste'yi işaretleyip kaydedin."
          - "VPNRemy profilini açın."
  # --------------------------------------------------------
  # Server labels. Host records are shared by all brands.
  hosts:
    names:
      eu_nl_1: "🇳🇱 Hollanda"
      usa_fremont_1: "🇺🇸 ABD"
      ru_saint_petersburg_1: "Rusya"
      eu_ru_nl_1: "Hollanda"
      eu_ru_us_1: "ABD"
  # --------------------------------------------------------
  config_manual:
    text: |
      *Kimlik Bilgileriniz*

      Kullanıcı Adı: `%<username>s`

      Şifre: `%<password>s`
  # --------------------------------------------------------
  config_not_found:
    text: |
      Konfigürasyon bulunamadı!
  # --------------------------------------------------------
  config_apple:
    text: |
      Lütfen dosyayı indirip cihazınıza kurun. Dosya kurulduktan sonra, sistem ayarlarında bir profilin kurulumunu onaylamanız gerekecektir.
  # --------------------------------------------------------
  config_android:
    text: |
      Lütfen dosyayı indirin ve şu uygulama kullanılarak açın: https://play.google.com/store/apps/details?id=org.strongswan.android
      Aşağıda listelenen kullanıcı adı ve şifre istenecektir.

      Kullanıcı Adı:
      `%<username>s`

      Şifre:
      `%<password>s`

      (kopyalamak için tıklayın ^^)
  # --------------------------------------------------------
  config_custom:
    text: |
      *Özel Ayarlar*

      Sistem ayarlarını kullanarak ve aşağıdaki kimlik bilgilerini kullanarak bağlanabilirsiniz:

      Bağlantı Adı: `%<name>s`

      Tür: `%<type>s`

      Sunucu Hostu: `%<host>s`

      Sunucu Kimliği: `%<host>s`

      IPSec Tanımlayıcı: `%<username>s`

      Kullanıcı Adı: `%<username>s`

      Şifre: `%<password>s`

      CA sertifikası: (boş bırakın, kullanılmaz)

      Sunucu sertifikası: (boş bırakın, kullanılmaz)
  # --------------------------------------------------------
  lang:
    text: |
      *🌎 Dilinizi Seçin:*
    en: 🇬🇧 English
    ru: 🇷🇺 Русский
    tr: 🇹🇷 Türkiye
    zh: 🇨🇳 中文
    fa: 🇮🇷 فارسی
  # --------------------------------------------------------
  lang_custom:
    text: |
      *🔧 Yeni Dil*

      Lütfen daha fazla dil keşfetmek veya yazım hatalarını düzeltmek için bize katkıda bulunmaktan çekinmeyin. Daha fazla bilgi https://github.com/KebabVPN/i18n adresindedir.
  # --------------------------------------------------------
  referral:
    text: |
      *💰 Referans*

      Kişisel davet bağlantınız: `%<link>s`
      Kopyalamak ve arkadaşlarınıza göndermek için tıklayın!

      Davet edilen kullanıcılar: *%<users_invited_count>s*
      Referans bakiyesi: *%<ref_balance_usd>s*
      VPN süresi kazanma oranı: *%<ref_time_percent>s*
      Para kazanma oranı: *%<ref_money_percent>s*

      Para çekme için bilgilerinizi sağlamak için @Techru1 ile iletişime geçin.
  # --------------------------------------------------------
  cabinet:
    text: |
      *👤 Kişisel hesap*

      Giriş yapmak için aşağıdaki düğmeye dokunun. Bağlantı yalnızca bir kez çalışır ve 10 dakika geçerlidir.
  # --------------------------------------------------------
  referral_v2:
    friend_discount: "Arkadaşınız bağlantınızla ilk ödemede %10 indirim alır. Bu indirim promosyon koduyla birleşmez."
    example: "%<price>s tutarındaki bir abonelikten %<reward>s kazanırsınız."
    example_fixed: "Müşterinizin her ödemesinden %<reward>s kazanırsınız."
    rates: "Her ödemeden: müşterileriniz için %<r1>s, müşterilerinizin müşterileri için %<r2>s, üçüncü seviye için %<r3>s."
    rates_fixed: "Müşterilerinizin ödemelerinden ödülün %<r1>s kadarını, onların müşterilerinden %<r2>s, üçüncü seviyeden %<r3>s alırsınız."
    text: |
      *💰 Referans*

      Davet bağlantınız: `%<link>s`
      Kopyalamak için dokunun ve arkadaşlarınızla paylaşın: yaptıkları her ödemeden kazanırsınız.

      %<rates>s
      %<terms>s
      Bakiye: kullanılabilir *%<available>s*, beklemede *%<on_hold>s*.

      İstatistikler, bakiye ve para çekme işlemleri kişisel hesabınızda.

vpnremy_zh:
  welcome:
    text: |
      *%<title>s*

      试用期为 %<trial>s，截止到 *%<exp>s*。

      请选择连接的国家：
  menu:
    back: ⬅️ 返回
    home: 🏠 主菜单
    home_short: 🏠 主页
    config: ⚙️ 配置
    subscription: 💸 订阅
    subscription_back: 💸 返回订阅
    subscription_back_short: 💸 返回
    lang: 🌎 语言
    lang_back: 🌎 返回语言
    lang_custom: 🔧 新语言
    help: ℹ️ 帮助
    delete_message: 🥷 删除消息
    settings: 🔧 设置
    settings_notifications_enable: 🔕 启用通知
    settings_notifications_disable: 🔔 禁用通知
    subscription_management_stripe: 💸 订阅 (Stripe)
    referral: 💰 推荐
    cabinet: 👤 个人中心
    cabinet_open: 🔐 登录个人中心
    promo_generate: 🎟 生成优惠码
    promo_enter: 🎟 输入优惠码
    platform_apple:  Apple (iOS, MacOS)
    platform_android: 📱 Android
    platform_custom: 🔑 其他
  # --------------------------------------------------------
  platforms:
    text: |
      *选择您的平台:*

      选择您想设置的操作系统。您将获得所需的凭据和配置文件。请注意，可能会显示一些敏感信息。
  # --------------------------------------------------------
  help:
    text: |
      *可用命令:*

      🏠 /start - 启动机器人并注册

      ⚙️ /config - 管理配置

      💸 /subscription - 管理您的订阅

      🌎 /lang - 管理机器人语言

      🔧 /settings - 管理设置

      ℹ️ /help - 获取命令列表

      🤖 @vpnremy\_support\_bot - 获取支持
  # --------------------------------------------------------
  start:
    text: |
      *🌟 欢迎！ 🌟*

      感谢您选择 [VPNRemy](https://vpnremy.com)。要开始使用 VPN，请按下面的 *配置* 按钮，您将获得需要安装到设备上的配置文件。详细指南请参阅 https://vpnremy.com。通过运行 /help 命令可访问所有选项。
  # --------------------------------------------------------
  sub_extended:
    text: |
      🌟 *恭喜！* 🌟

      您获得了 *%<days>s* 天的 VPN 使用权！请随时在 @vpnremy\_support\_bot 中给我们写反馈！🫶

      您的订阅到期时间为：*%<exp>s*
  # --------------------------------------------------------
  sub_expired:
    text: |
      ❌ *订阅已过期！* ❌

      很抱歉发现您的订阅在 *%<exp>s* 过期

      您需要执行 /subscription 命令以继续使用服务。

      如果您有任何问题，请在 @vpnremy\_support\_bot 联系我们！🫶
  # --------------------------------------------------------
  sub_expiring:
    text: |
      ⏰ *您的订阅即将到期* ⏰

      剩余天数：*%<days>s*。您的订阅到期时间为：*%<exp>s*

      请执行 /subscription 命令续订，以保持 VPN 不间断使用。

      如果您有任何问题，请在 @vpnremy\_support\_bot 联系我们！🫶
  # --------------------------------------------------------
  subscription:
    ico_yes: ✅
    ico_no: ❌
    menu:
      crypto: 使用 USDT 支付 (TRC-20，任意金额)
      plan_1_mo: 💵 1 个月 - 299.00 俄罗斯卢布
      plan_6_mo: 💵 6 个月 - 1614.00 俄罗斯卢布
      plan_12_mo: 💵 12 个月 - 2988.00 俄罗斯卢布
    text: |
      *您的订阅:*

      到期日期：*%<exp>s* %<ico>s (活跃天数 %<days>s)
      通过付款，您同意我们的[服务条款](https://vpnremy.com/terms)。
  # --------------------------------------------------------
  payment_options:
    checkout_pending: "首付款折扣订单尚未过期。请在过期后更改套餐或付款方式。"
    menu:
      pm_stripe_payment: 💳 信用卡，WeChat，Alipay，ApplePay，GPay
      pm_stripe_subscription: 💳 信用卡 (订阅)
      pm_pay2day: 🇷🇺 SBP (RUB)
    text: |
      *您的订阅:*

      到期日期：*%<exp>s* %<ico>s (活跃天数 %<days>s)
      通过付款，您同意我们的[服务条款](https://vpnremy.com/terms)。

      您正在购买：*%<description>s*

      请选择付款方式：
  # --------------------------------------------------------
  plan_unknown:
    text: |
      计划已禁用或未知！运行 /subscription 命令以获取可购买的计划。
  # --------------------------------------------------------
  sub_crypto:
    text: |
      *您的充值 TRC-20 地址*：

      `%<addr_trc20>s`
      (点击以复制)

      根据有效价格，USDT 存款会被计算为美元。例如，如果您想支付 12 个月，只需转账 `49.99` USDT。您可以转账任意金额，到期日期将按比例计算。

      我们等待 *20 个确认* 以处理交易，因此您需要等待一段时间。一旦交易处理完成，您将收到一条包含充值确认的通知。如果您的充值未到账，请随时在 @Techru1 中联系我们。
  # --------------------------------------------------------
  config:
    text: |
      *选择位置:*

      请选择要设置 VPN 配置的位置。系统将要求您选择所使用的操作系统。
  # --------------------------------------------------------
  # The config file name, the same in the bot and in the cabinet (Host#config_file_name).
  onboarding:
    file: "VPNRemy-%<server>s"
    setup:
      android_credentials_hint: "如果 strongSwan 要求输入用户名和密码，请输入这些凭据"
      ready: "配置已准备好"
      download: "下载配置"
      back: "选择其他设备"
      manual_title: "连接信息"
      checks_title: "无法连接时"
      checks:
        - "检查订阅有效期、用户名和密码。"
        - "尝试其他服务器或网络。"
        - "检查设备日期和时间；必要时重新安装配置文件。"
      confirmation: "首次连接后，机器人会发送确认消息。需要帮助请联系 @vpnremy_support_bot。"
      iphone:
        title: "在 iPhone 或 iPad 上连接"
        steps:
          - "下载配置文件。如果无法打开，先保存到“文件”，再从中打开。"
          - "打开“设置”→“已下载描述文件”。如果没有该选项，打开“通用”→“VPN 与设备管理”。"
          - "点按“安装”并输入设备密码。"
          - "在“设置”→“VPN”中打开 VPNRemy。"
      mac:
        title: "在 macOS 上连接"
        steps:
          - "下载配置文件并双击打开。"
          - "在“系统设置”中找到“描述文件”。位置因 macOS 版本而异。"
          - "打开 VPNRemy 描述文件，点按“安装”并输入 Mac 密码。"
          - "在“系统设置”→“VPN”中打开 VPNRemy。"
      android:
        title: "在 Android 上连接"
        steps:
          - "从 Google Play 安装 strongSwan VPN Client：https://play.google.com/store/apps/details?id=org.strongswan.android"
          - "下载配置文件。用 strongSwan 打开，或在应用菜单中选择“导入 VPN 配置文件”。"
          - "如果提示，请输入配置消息中的用户名和密码，然后点按“导入”或“保存”。"
          - "点按 VPNRemy 配置文件并允许 VPN 连接。"
      custom:
        title: "在 Windows 10 或 11 上连接"
        steps:
          - "打开“设置”→“网络和 Internet”→“VPN”→“添加 VPN”。"
          - "提供商选 Windows（内置），名称填写 VPNRemy，服务器地址填写连接信息。"
          - "VPN 类型选 IKEv2，登录方式选用户名和密码。输入信息并保存。"
          - "选择 VPNRemy，点击“连接”。"
      linux:
        title: "在 Linux 上连接"
        steps:
          - "安装 NetworkManager 的 strongSwan 插件。Ubuntu 和 Debian：sudo apt install network-manager-strongswan"
          - "打开“设置”→“网络”→“VPN”→“+”→“IPsec/IKEv2 (strongswan)”。"
          - "输入连接信息中的服务器地址，证书字段留空。"
          - "选择 EAP 认证，输入用户名和密码，勾选“请求内部 IP 地址”并保存。"
          - "打开 VPNRemy 配置文件。"
  # --------------------------------------------------------
  # Server labels. Host records are shared by all brands.
  hosts:
    names:
      eu_nl_1: "🇳🇱 荷兰"
      usa_fremont_1: "🇺🇸 美国"
      ru_saint_petersburg_1: "俄罗斯"
      eu_ru_nl_1: "荷兰"
      eu_ru_us_1: "美国"
  # --------------------------------------------------------
  config_manual:
    text: |
      *您的凭据*

      用户名：%<username>s

      密码：%<password>s
  # --------------------------------------------------------
  config_not_found:
    text: |
      未找到配置！
  # --------------------------------------------------------
  config_apple:
    text: |
      请下载文件并将其安装到您的设备上。安装文件后，您需要在系统设置中确认配置文件的安装。
  # --------------------------------------------------------
  config_android:
    text: |
      请下载文件并使用应用程序 https://play.google.com/store/apps/details?id=org.strongswan.android 打开它。
      您将被要求输入以下用户名和密码。

      用户名：
      `%<username>s`

      密码：
      `%<password>s`

      (点击 以复制 ^^)
  # --------------------------------------------------------
  config_custom:
    text: |
      *自定义设置*

      您可以使用系统设置和以下凭据进行连接：

      连接名称：%<name>s

      类型：%<type>s

      服务器主机：%<host>s

      服务器标识：%<host>s

      IPSec 标识符：%<username>s

      用户名：%<username>s

      密码：%<password>s

      CA 证书：（留空，不使用）

      服务器证书：（留空，不使用）
  # --------------------------------------------------------
  lang:
    text: |
      *🌎 选择您的语言:*
    en: 🇬🇧 English
    ru: 🇷🇺 Русский
    tr: 🇹🇷 Türkiye
    zh: 🇨🇳 中文
    fa: 🇮🇷 فارسی
  # --------------------------------------------------------
  lang_custom:
    text: |
      *🔧 新语言*

      请随时向我们贡献更多语言或修复拼写错误。有关更多信息，请访问页面：https://github.com/KebabVPN/i18n
  # --------------------------------------------------------
  referral:
    text: |
      *💰 推荐*

      您的个人邀请链接为：%<link>s
      单击复制并发送给您的朋友！

      已邀请用户：%<users_invited_count>s
      推荐奖金余额：%<ref_balance_usd>s
      VPN 时间获取率：%<ref_time_percent>s
      货币获取率：%<ref_money_percent>s

      联系 @Techru1 提供提款信息。
  # --------------------------------------------------------
  cabinet:
    text: |
      *👤 个人中心*

      点击下方按钮登录。该链接仅可使用一次,10 分钟内有效。
  # --------------------------------------------------------
  referral_v2:
    example: "订阅 %<price>s,您可获得 %<reward>s。"
    example_fixed: "您的客户每付款一次,您可获得 %<reward>s。"
    rates: "每笔付款:直接客户 %<r1>s,客户的客户 %<r2>s,第三级 %<r3>s。"
    rates_fixed: "您可获得直接客户付款奖励的 %<r1>s,客户的客户的 %<r2>s,第三级的 %<r3>s。"
    text: |
      *💰 推荐*

      您的邀请链接:`%<link>s`
      点击复制并分享给朋友:您可从他们的每笔付款中获得奖励。

      %<rates>s
      %<terms>s
      余额:可用 *%<available>s*,冻结中 *%<on_hold>s*。

      统计、余额和提现请前往个人中心。
  # --------------------------------------------------------
  referral_v2_inactive:
    text: |
      *💰 推荐*

      首次付款后即可加入合作伙伴计划。届时您的邀请链接将显示在这里和个人中心。
  # --------------------------------------------------------
  promo_templates:

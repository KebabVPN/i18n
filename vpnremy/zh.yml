      *🎟 %<name>s*

      已生成优惠码:%<count>s 个

      %<codes>s

      点击优惠码即可复制。所有优惠码及其使用情况可在个人中心查看。
  # --------------------------------------------------------
  promo_codes_file:
    text: |
      *🎟 %<name>s*

      已生成优惠码:%<count>s 个,列表见文件。
  # --------------------------------------------------------
  settings:
    text: |
      *🔧 设置*
  # --------------------------------------------------------
  unknown:
    text: |
      未知命令，请运行 /help 以列出所有可用命令！
  # --------------------------------------------------------
  promo_enter:
    text: |
      *🎟 优惠码*


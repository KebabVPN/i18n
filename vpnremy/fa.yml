  sub_crypto:
    text: |
      *آدرس TRC-20 برای پرداخت*:

      `%<addr_trc20>s`
      (برای کپی کردن آن، روی آن کلیک کنید)

      مقادیر پرداخت USDT بر اساس دلار محاسبه می‌شوند. به عنوان مثال، برای پرداخت به مدت 12 ماه، فقط کافیست `49.99` USDT ارسال کنید. می‌توانید مقدار دلخواهی ارسال کنید و مدت اشتراک شما به نسبت هزینه آن محاسبه می‌شود.

      برای تایید پرداخت، نیاز به *20 تایید* تراکنش دارید که ممکن است کمی زمان ببرد. بعد از تایید تراکنش، اطلاعاتی دریافت خواهید کرد. اگر تراکنش شما پس از 10 دقیقه منتظره هنوز تایید نشده باشد، لطفاً با @Techru1 تماس بگیرید.
  # --------------------------------------------------------
  config:
    text: |
      *پیکربندی VPN شما*

      لطفاً یک پیکربندی مناسب برای دستگاه خود انتخاب کنید. اکثر تلفن‌ها و سیستم‌ها پروتکل IPSec را پشتیبانی می‌کنند. دستورالعمل‌های مفصل در [مستندات](https://vpnremy.com/guide) موجود است.
  # --------------------------------------------------------
  # The config file name, the same in the bot and in the cabinet (Host#config_file_name).
  onboarding:
    file: "VPNRemy-%<server>s"
    setup:
      android_credentials_hint: "اگر strongSwan نام کاربری و رمز عبور خواست، این اطلاعات را وارد کنید"
      ready: "پیکربندی آماده است"
      download: "دانلود پیکربندی"
      back: "انتخاب دستگاه دیگر"
      manual_title: "اطلاعات اتصال"
      checks_title: "اگر اتصال برقرار نشد"
      checks:
        - "اعتبار اشتراک، نام کاربری و گذرواژه را بررسی کنید."
        - "سرور یا شبکهٔ دیگری را امتحان کنید."
        - "تاریخ و ساعت دستگاه را بررسی کنید؛ در صورت نیاز پروفایل را دوباره نصب کنید."
      confirmation: "پس از اولین اتصال، ربات تأیید می‌فرستد. برای کمک به @vpnremy_support_bot پیام دهید."
      iphone:
        title: "اتصال در iPhone و iPad"
        steps:
          - "پروفایل را دانلود کنید. اگر باز نشد، آن را در Files ذخیره و از آنجا باز کنید."
          - "Settings → Profile Downloaded را باز کنید. اگر نبود، به General → VPN & Device Management بروید."
          - "Install را بزنید و رمز عبور دستگاه را وارد کنید."
          - "در Settings → VPN، VPNRemy را روشن کنید."
      mac:
        title: "اتصال در macOS"
        steps:
          - "پروفایل را دانلود کنید و فایل را دوبار کلیک کنید."
          - "در System Settings بخش Profiles را پیدا کنید. جای آن به نسخهٔ macOS بستگی دارد."
          - "پروفایل VPNRemy را باز کنید، Install را بزنید و گذرواژهٔ Mac را وارد کنید."
          - "در System Settings → VPN، VPNRemy را روشن کنید."
      android:
        title: "اتصال در Android"
        steps:
          - "strongSwan VPN Client را از Google Play نصب کنید: https://play.google.com/store/apps/details?id=org.strongswan.android"
          - "فایل را دانلود کنید. آن را با strongSwan باز کنید یا از منوی برنامه Import VPN profile را بزنید."
          - "اگر درخواست شد، نام کاربری و گذرواژهٔ پیام پیکربندی را وارد کنید و Import یا Save را بزنید."
          - "پروفایل VPNRemy را بزنید و اجازهٔ اتصال VPN را بدهید."
      custom:
        title: "اتصال در Windows 10 و 11"
        steps:
          - "Settings → Network & Internet → VPN → Add VPN را باز کنید."
          - "ارائه‌دهنده را Windows (built-in) بگذارید، نام VPNRemy و نشانی سرور در اطلاعات اتصال را وارد کنید."
          - "نوع VPN را IKEv2 و نوع ورود را نام کاربری و گذرواژه بگذارید. اطلاعات را وارد و ذخیره کنید."
          - "VPNRemy را انتخاب کنید و Connect را بزنید."
      linux:
        title: "اتصال در Linux"
        steps:
          - "افزونهٔ strongSwan برای NetworkManager را نصب کنید. Ubuntu و Debian: sudo apt install network-manager-strongswan"
          - "Settings → Network → VPN → + → IPsec/IKEv2 (strongswan) را باز کنید."
          - "نشانی سرور در اطلاعات اتصال را وارد کنید و بخش گواهی را خالی بگذارید."
          - "احراز هویت EAP را انتخاب کنید، نام کاربری و گذرواژه را وارد کنید، Request an inner IP address را فعال و ذخیره کنید."
          - "پروفایل VPNRemy را روشن کنید."
  # --------------------------------------------------------
  # Server labels. Host records are shared by all brands.
      important: "VPN را از تنظیمات دستگاه یا در Android از strongSwan روشن و خاموش کنید. فعال‌سازی خودکار بر اساس تقاضا در پیکربندی iPhone و Mac خاموش است. پس از قطع اتصال، سیستم یا برنامه ممکن است دوباره برای اتصال تلاش کند. فایل، نام کاربری و گذرواژه را به دیگران ندهید؛ با آن‌ها می‌توان از اشتراک شما استفاده کرد."

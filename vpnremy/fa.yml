  cabinet:
    text: |
      *👤 حساب کاربری*

      برای ورود، دکمه زیر را بزنید. این لینک فقط یک بار کار می‌کند و ۱۰ دقیقه اعتبار دارد.
  # --------------------------------------------------------
  referral_v2:
    friend_discount: "دوست شما با لینک شما برای اولین پرداخت ۱۰٪ تخفیف می‌گیرد. این تخفیف با کد تبلیغاتی جمع نمی‌شود."
    example: "از اشتراک %<price>s، %<reward>s دریافت می‌کنید."
    example_fixed: "از هر پرداخت مشتری خود %<reward>s دریافت می‌کنید."
    rates: "از هر پرداخت: %<r1>s برای مشتریان شما، %<r2>s برای مشتریانِ مشتریان شما، %<r3>s برای سطح سوم."
    rates_fixed: "شما %<r1>s پاداش را از پرداخت‌های مشتریان خود، %<r2>s را از مشتریان آن‌ها و %<r3>s را از سطح سوم دریافت می‌کنید."
    text: |

    subscription_management_stripe: Подписка (Stripe)
    referral: Пригласить друзей
    cabinet: Личный кабинет
    invite_more: Пригласить ещё
    cabinet_open: 🔐 Войти в личный кабинет
    promo_generate: Сгенерировать промокоды
    promo_enter: 🎟 Ввести промокод
    platform_apple:  Apple (iOS, MacOS)
    platform_android: Android

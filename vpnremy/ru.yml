vpnremy_ru:
  menu:
    back: ⬅️ Назад
    home: 🏠 Главное меню
    home_short: 🏠 Главная
    config: 🔌 Подключиться
    subscription: 💸 Подписка
    subscription_back: 💸 Назад к подписке
    subscription_back_short: 💸 Вернуться
    lang: 🌎 Язык
    lang_back: 🌎 Назад к языкам
    lang_custom: 🔧 Новый язык
    help: ℹ️ Помощь
    delete_message: 🥷 Удалить сообщение
    settings: 🔧 Настройки
    settings_notifications_enable: 🔔 Включить напоминания
    settings_notifications_disable: 🔕 Выключить напоминания
    subscription_management_stripe: 💸 Подписка (Stripe)
    referral: 🎁 Пригласить друзей
    cabinet: 👤 Личный кабинет
    invite_more: 💰 Пригласить ещё
    cabinet_open: 🔐 Войти в личный кабинет
    promo_generate: 🎟 Сгенерировать промокоды
    promo_enter: 🎟 Ввести промокод
    platform_apple:  Apple (iOS, MacOS)
    platform_android: 📱 Android
    platform_custom: 🔑 Другое
    ref_pay: ✅ Оплатить
    support: 💬 Поддержка
    support_open: 💬 Написать в поддержку
    share: 📤 Поделиться
    other_plan: 💸 Другой тариф
    other_direction: 🌍 Другое направление
    other_device: 📱 Другое устройство
    guide_iphone: 📖 Инструкция для iPhone
    guide_mac: 📖 Инструкция для Mac
    guide_android: 📖 Инструкция для Android
    guide_custom: 📖 Инструкция для Windows
    not_connected: 😕 Не получается подключиться
    open_guide: 📖 Открыть инструкцию
    retry: 🔄 Повторить
  # --------------------------------------------------------
  # Bot dates are Moscow time (T.bot_time); `days` is a plain count of days.
  bot_time: "%{date}, %{time} по МСК"
  days:
    one: "%{count} день"
    few: "%{count} дня"
    many: "%{count} дней"
    other: "%{count} дня"
  # --------------------------------------------------------
  # The bot's "Menu" button, see bin/rails bot:set_commands[vpnremy]
  commands:
    start: Главное меню
    config: Подключиться
    subscription: Подписка и оплата
    referral: Пригласить друзей
    help: Помощь
    support: Написать в поддержку
  # --------------------------------------------------------
  platforms:
    text: |
      *Выберите устройство*

      Направление «%<server>s» выбрано. На каком устройстве будете пользоваться VPNRemy? Для каждого — своя настройка.
  # --------------------------------------------------------
  help:
    text: |
      *Чем помочь?*

      Не нашли ответ — напишите в поддержку, ответит человек.

      /start — главное меню
      /config — подключиться
      /subscription — подписка
      /referral — пригласить друзей
      /support — поддержка
      /help — эта подсказка
  # --------------------------------------------------------
  support:
    url: https://t.me/Techru1
    text: |
      *💬 Поддержка*

      Напишите нам — ответит человек.
  # --------------------------------------------------------
  start:
    text: |
      *С возвращением!*

      Подписка активна до *%<exp>s* — %<days_left>s.
      Что сделаем?
  # --------------------------------------------------------
  start_expired:
    text: |
      *Подписка закончилась %<date>s*

      Чтобы снова пользоваться VPNRemy, выберите тариф.
  # --------------------------------------------------------
  welcome:
    invited: "Вас пригласил %<name>s."
    friend: друг
    text: |
      *Вы сделали первый шаг к свободному интернету*

      %<invited>sТестовый доступ на %<trial>s — до *%<exp>s*.

      Выберите, куда подключиться:

      *Открыть мир* — вы в России и хотите пользоваться зарубежными сайтами и сервисами. Подойдут Нидерланды или США.

      *Россия рядом* — вы за границей и хотите пользоваться российскими сервисами: банками, Госуслугами, маркетплейсами.
  # --------------------------------------------------------
  sub_extended:
    text: |
      ✅ *Подписка продлена на %<period>s*

      Действует до *%<exp>s*.
      Ничего настраивать не нужно — всё продолжит работать.
  # --------------------------------------------------------
  sub_expired:
    text: |
      ❌ *Подписка закончилась %<date>s*

      Чтобы снова пользоваться VPNRemy, выберите тариф. Оплатить можно по QR‑коду (СБП) или в USDT.
  # --------------------------------------------------------
  sub_expired_trial:
    text: |
      *Тестовый доступ закончился %<date>s*

      Понравилось? Чтобы и дальше пользоваться VPNRemy, выберите тариф.
  # --------------------------------------------------------
  sub_expiring:
    text: |
      ⏰ *%<left>s*

      Подписка VPNRemy действует до *%<exp>s*. Продлите заранее — оплаченные дни добавятся к текущим.

      Напоминания можно выключить в настройках.
  # --------------------------------------------------------
  sub_expiring_trial:
    text: |
      ⏰ *%<left>s тестового доступа*

      Пользоваться VPNRemy бесплатно можно до *%<exp>s*. Чтобы интернет не отключился, выберите тариф заранее.

      Напоминания можно выключить в настройках.
  # --------------------------------------------------------
  subscription:
    ico_yes: ✅
    ico_no: ❌
    menu:
      crypto: 🤑 USDT (TRC‑20, любая сумма)
      plan_1_mo: 💵 1 месяц - 299.00 RUB
      plan_6_mo: 💵 6 месяцев - 1614.00 RUB
      plan_12_mo: 💵 12 месяцев - 2988.00 RUB
    text: |
      *Ваша подписка активна* %<ico>s

      Действует до *%<exp>s*. Осталось: *%<period>s*.
      Продлить можно заранее — оплаченные дни добавятся к текущим.

      Если передумаете, вернём деньги в течение 14 дней после первой оплаты. Оплачивая, вы соглашаетесь с [Условиями использования](https://vpnremy.com/terms).
    text_expired: |
      *Подписка закончилась %<date>s*

      Чтобы снова пользоваться VPNRemy, выберите тариф. Оплатить можно по QR‑коду (СБП) или в USDT.

      Если передумаете, вернём деньги в течение 14 дней после первой оплаты. Оплачивая, вы соглашаетесь с [Условиями использования](https://vpnremy.com/terms).
  # --------------------------------------------------------
  payment_options:
    menu:
      pm_stripe_payment: 💳 Карта, WeChat, Alipay, ApplePay, GPay
      pm_stripe_subscription: 💳 Карта (подписка)
      pm_pay2day: 📷 По QR‑коду (СБП)
      pm_ref_balance: 💰 С реферального баланса
    text: |
      *Тариф «%<plan>s» — %<price>s*

      Как удобнее оплатить?
  # --------------------------------------------------------
  ref_pay_confirm:
    text: |
      *💰 Оплата с реферального баланса*

      Списать *%<amount>s* с реферального баланса за тариф «%<plan>s»?

      Доступно: *%<available>s*
  # --------------------------------------------------------
  ref_pay_short:
    text: |
      *💰 Не хватает %<missing>s* на реферальном балансе.

      Доступно: *%<available>s*. Выберите другой тариф или способ оплаты.
  # --------------------------------------------------------
  ref_pay_done:
    text: |
      ✅ *Оплачено с реферального баланса:* %<amount>s

      Подписка действует до *%<exp>s*.
  # --------------------------------------------------------
  plan_unknown:
    text: |
      План отключен или неизвестен! Запустите команду /subscription, чтобы узнать доступные для покупки планы.
  # --------------------------------------------------------
  sub_crypto:
    text: |
      *Ваш адрес для пополнения TRC-20*:

      `%<addr_trc20>s`
      (нажмите, чтобы скопировать)

      Депозиты в USDT рассчитываются как USD в соответствии с эффективным ценообразованием. Например, если вы хотите заплатить за 12 месяцев, просто переведите `49.99` USDT. Вы можете перевести любую сумму, которую хотите, и срок окончания подписки будет рассчитан пропорционально.

      Мы ждем *20 подтверждений* для обработки транзакции, поэтому вам придется подождать некоторое время. После обработки транзакции вы получите уведомление с подтверждением вашего депозита. Если ваш депозит не был зачислен, не стесняйтесь написать нам в @Techru1.
  # --------------------------------------------------------
  config:
    text: |
      *Выберите местоположение:*

      Выберите местоположение, для которого вы хотите настроить конфигурацию VPN. Вас попросят указать используемую операционную систему.
  # --------------------------------------------------------
  # Server names and groups (Host#display_name, Host.grouped); the records are shared by all brands.
  hosts:
    names:
      eu_nl_1: "🇳🇱 Нидерланды"
      usa_fremont_1: "🇺🇸 США"
      ru_saint_petersburg_1: "🇷🇺 Россия — Санкт-Петербург"
      eu_ru_nl_1: "🇳🇱 Нидерланды (через Россию)"
      eu_ru_us_1: "🇺🇸 США (через Россию)"
    groups:
      - title: "Прямое подключение"
        hint: "попробуйте сначала его"
        hosts: [eu_nl_1, usa_fremont_1, ru_saint_petersburg_1]
      - title: "Через Россию"
        hint: "если прямое подключение не работает"
        hosts: [eu_ru_nl_1, eu_ru_us_1]
  # --------------------------------------------------------
  config_manual:
    text: |
      *Ваши учетные данные*

      Имя пользователя: `%<username>s`

      Пароль: `%<password>s`
  # --------------------------------------------------------
  config_not_found:
    text: |
      Конфигурация не найдена!
  # --------------------------------------------------------
  config_apple:
    text: |
      *Конфигурация «%<server>s» для iPhone, iPad или Mac готова*

      Скачайте файл и откройте его — устройство предложит установить профиль.
      iPhone и iPad: «Настройки» → «Профиль загружен» → «Установить».
      Mac: «Системные настройки» → «Конфиденциальность и безопасность» → «Профили» → «Установить».
      Затем включите VPN в настройках.
  # --------------------------------------------------------
  config_iphone:
    text: |
      *Конфигурация «%<server>s» для iPhone готова*

      Скачайте файл и откройте его — iPhone предложит установить профиль.
  # --------------------------------------------------------
  config_mac:
    text: |
      *Конфигурация «%<server>s» для Mac готова*

      Скачайте файл и откройте его — Mac предложит установить профиль.
  # --------------------------------------------------------
  config_android:
    text: |
      *Конфигурация «%<server>s» для Android готова*

      1. Установите приложение [strongSwan](https://play.google.com/store/apps/details?id=org.strongswan.android) из Google Play
      2. Сохраните файл на телефон
      3. В strongSwan: меню ⋮ → «Импорт VPN‑профиля» → выберите файл

      Логин: `%<username>s`
      Пароль: `%<password>s`

      Понадобятся, если strongSwan попросит их при подключении. Никому не пересылайте — по ним можно пользоваться вашей подпиской.
  # --------------------------------------------------------
  config_custom:
    text: |
      *Подключение «%<server>s» для Windows*

      Для Windows файл не нужен — VPN встроен в систему. Введите эти данные в настройках VPN. Нажмите на значение, чтобы скопировать.

      Сервер: `%<host>s`
      Логин: `%<username>s`
      Пароль: `%<password>s`

      Никому не пересылайте логин и пароль — по ним можно пользоваться вашей подпиской.
  # --------------------------------------------------------
  # The first /start, the guides after a config, "you are connected" (the first VPN login).
  onboarding:
    # the buttons of the first /start; a host missing from the database is not shown
    directions:
      - host: eu_nl_1
        title: 🇳🇱 Открыть мир через Нидерланды
      - host: usa_fremont_1
        title: 🇺🇸 Открыть мир через США
      - host: ru_saint_petersburg_1
        title: 🇷🇺 Подключиться в Россию
    # the name of the file the customer gets, without the extension
    file: "VPNRemy-%<server>s"
    guide_iphone: |
      *Как подключиться на iPhone*

      1. Нажмите на файл %<file>s выше и разрешите загрузку профиля
      2. Откройте Настройки → «Профиль загружен» → «Установить»
      3. Включите VPN: Настройки → VPN → VPNRemy

      Как только подключитесь, бот сам пришлёт подтверждение.
    guide_mac: |
      *Как подключиться на Mac*

      1. Откройте файл %<file>s из сообщения выше
      2. Системные настройки → «Конфиденциальность и безопасность» → «Профили» → «Установить»
      3. Включите VPN: Системные настройки → VPN → VPNRemy

      Как только подключитесь, бот сам пришлёт подтверждение.
    guide_android: |
      *Как подключиться на Android*

      1. Установите приложение [strongSwan](https://play.google.com/store/apps/details?id=org.strongswan.android) из Google Play
      2. Сохраните файл %<file>s из сообщения выше на телефон
      3. Откройте strongSwan → меню ⋮ → «Импорт VPN‑профиля» → выберите файл
      4. Нажмите на профиль VPNRemy. Если попросит — введите логин и пароль из сообщения выше

      Как только подключитесь, бот сам пришлёт подтверждение.
    guide_custom: |
      *Как подключиться на Windows 10 и 11*

      1. Откройте Параметры → Сеть и Интернет → VPN → «Добавить VPN»
      2. Поставщик — «Windows (встроенные)», имя — VPNRemy, адрес сервера — из сообщения выше
      3. Тип VPN — IKEv2, вход — «Имя пользователя и пароль». Введите логин и пароль → «Сохранить»
      4. Нажмите VPNRemy → «Подключиться»

      Как только подключитесь, бот сам пришлёт подтверждение.
    not_connected: |
      *Вы получили конфигурацию, но ещё не подключились*

      Так бывает: чаще всего не установлено приложение или профиль не подтверждён в настройках. Посмотрите инструкцию или напишите нам — поможем.
    trial_until: "\nТестовый доступ действует до *%<exp>s*.\n"
    error: |
      *Не получилось подготовить конфигурацию*

      Сервер «%<server>s» сейчас не отвечает. Повторите через несколько минут или выберите другое направление.
    connected_trial: |
      *Готово, вы подключились к VPNRemy*

      Вам доступен тестовый доступ на %<period>s. Пользоваться VPNRemy можно до *%<exp>s*.
      Когда тестовый период закончится, подписку можно продлить одним из способов ниже.
    connected: |
      *Готово, вы подключились к VPNRemy*

      Подписка действует до *%<exp>s*.
  # --------------------------------------------------------
  lang:
    text: |
      *🌎 Выберите свой язык:*
    en: 🇬🇧 English
    ru: 🇷🇺 Русский
    tr: 🇹🇷 Türkiye
    zh: 🇨🇳 中文
    fa: 🇮🇷 فارسی
  # --------------------------------------------------------
  lang_custom:
    text: |
      *🔧 Новый язык*

      Пожалуйста, не стесняйтесь вносить свой вклад, чтобы изучить больше языков или исправить ошибки. Дополнительная информация доступна на странице: https://github.com/KebabVPN/i18n
  # --------------------------------------------------------
  referral:
    text: |
      *💰 Реферал*

      Ваш персональный пригласительный ссылка: `%<link>s`
      Нажмите, чтобы скопировать и отправить друзьям!

      Приглашенные пользователи: *%<users_invited_count>s*
      Баланс реферала: *%<ref_balance_usd>s*
      Ставка получения денег: *%<ref_money_percent>s*

      Свяжитесь с @Techru1, чтобы предоставить ваши реквизиты для вывода денег.
  # --------------------------------------------------------
  cabinet:
    text: |
      *👤 Личный кабинет*

      Нажмите кнопку ниже, чтобы войти. Ссылка одноразовая и действует 10 минут.
  # --------------------------------------------------------
  referral_v2:
    example: "С подписки за %<price>s вы получите %<reward>s."
    example_fixed: "С каждой оплаты вашего клиента вы получите %<reward>s."
    friend: "Друг получит %<bonus>s к первой оплате."
    rates: "С каждой оплаты: %<r1>s — за ваших клиентов, %<r2>s — за клиентов ваших клиентов, %<r3>s — за третью линию."
    rates_fixed: "Вы получаете %<r1>s вознаграждения с оплат ваших клиентов, %<r2>s — с клиентов ваших клиентов, %<r3>s — с третьей линии."
    share: "Попробуй VPNRemy — я пользуюсь, всё работает. Первые дни бесплатно."
    text: |
      *🎁 Приглашайте друзей*

      Ваша пригласительная ссылка: `%<link>s`
      Ваш промокод: `%<code>s`
      Нажмите, чтобы скопировать, и отправьте друзьям — или нажмите «Поделиться». Друзья получат бонус к первой оплате, а вы — долю с каждой их оплаты.

      Уже пригласили: *%<invited>s*
      %<rates>s
      %<terms>s
      Баланс: доступно *%<available>s*, в холде *%<on_hold>s*.
      Вывод — в USDT, в личном кабинете. Там же статистика.
  # --------------------------------------------------------
  ref_accrued:
    line_1: ваш клиент
    line_2: клиент вашего клиента
    line_3: 3-я линия
    text: |
      💸 *Друг оплатил подписку*

      Начислено: *+%<amount>s* — %<line>s
      Баланс: доступно *%<available>s*, в холде *%<on_hold>s*
      Начисление станет доступно %<date>s.
  # --------------------------------------------------------
  referral_v2_inactive:
    text: |
      *💰 Реферал*

      Партнёрская программа станет доступна после первой оплаты. Тогда здесь и в личном кабинете появятся ваша ссылка и промокод.
  # --------------------------------------------------------
  promo_templates:
    text: |
      *🎟 Промокоды*

      Выберите акцию для новых промокодов:
  # --------------------------------------------------------
  promo_templates_empty:
    text: |
      *🎟 Промокоды*

      Сейчас нет доступных акций. Загляните позже.
  # --------------------------------------------------------
  promo_count:
    text: |
      *🎟 %<name>s*

      Сколько промокодов создать? Каждый код одноразовый и без срока действия.
  # --------------------------------------------------------
  promo_codes:
    text: |
      *🎟 %<name>s*

      Создано промокодов: %<count>s

      %<codes>s

      Нажмите на код, чтобы скопировать. Все ваши коды и их использование — в личном кабинете.
  # --------------------------------------------------------
  promo_codes_file:
    text: |
      *🎟 %<name>s*

      Создано промокодов: %<count>s. Список — в файле.
  # --------------------------------------------------------
  settings:
    reminders_on: |-
      Напоминания о продлении *включены*.
      Они приходят за несколько дней до окончания подписки, чтобы интернет не отключился неожиданно.
    reminders_off: |-
      Напоминания о продлении *выключены*.
      Сообщения об оплате и окончании подписки приходят всегда.
    text: |
      *🔧 Настройки*

      %<reminders>s
  # --------------------------------------------------------
  unknown:
    text: |
      *Пока не понимаю свободный текст*

      Выберите нужное в меню ниже. Если вопрос не нашёлся — напишите в поддержку, там ответит человек.
  # --------------------------------------------------------
  promo_enter:
    text: |
      *🎟 Промокод*

      Отправьте промокод одним сообщением.
  # --------------------------------------------------------
  promo_applied:
    text: |
      ✅ Промокод `%<code>s` применён: %<bonus>s — сработает при оплате по СБП или с реферального баланса.
  # --------------------------------------------------------
  promo_current:
    text: |
      🎟 Применён промокод `%<code>s`: %<bonus>s
  # --------------------------------------------------------
  promo:
    bonus_percent: "−%<value>s%%"
    bonus_days: "+%<count>s дн."
    errors:

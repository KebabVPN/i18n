  # --------------------------------------------------------
  # Bot dates are Moscow time (T.bot_time); `days` is a plain count of days.
  bot_time: "%{date}, %{time} по МСК"
  days:
    one: "%{count} день"
    few: "%{count} дня"
    many: "%{count} дней"
    other: "%{count} дня"
  # --------------------------------------------------------
  # The bot's "Menu" button, see bin/rails bot:set_commands[vpnremy]
  commands:
    start: Главное меню
    config: Подключиться
    subscription: Подписка и оплата
    referral: Пригласить друзей
    help: Помощь и частые вопросы
    support: Написать в поддержку
  # --------------------------------------------------------
  platforms:
    text: |
      *Выберите устройство*

      Направление «%<server>s» выбрано. На каком устройстве будете пользоваться VPNRemy? Для каждого — своя настройка.
  # --------------------------------------------------------
  help:
    text: |
      *Чем помочь?*

      Выберите вопрос — ответ придёт сразу. Не нашли свой — напишите в поддержку, ответит человек.

      /start — главное меню · /config — подключиться · /subscription — подписка · /referral — пригласить друзей · /support — поддержка · /help — эта подсказка
  # --------------------------------------------------------
  # Help's questions (BotController::FAQ): the button, the answer.
  faq:
    guides: Инструкции
    more: Другие вопросы
    not_helped: "\nНе помогло? Напишите в поддержку — ответит человек.\n"
    vpn:
      title: Не подключается VPN
      text: |
        *Что проверить*

        1. Подписка активна — посмотрите в разделе «Подписка»
        2. Выключите и снова включите VPN
        3. Попробуйте другое направление
        4. Скачайте конфигурацию заново: «Подключиться» → направление → устройство
    change:
      title: Сменить устройство или направление
      text: |
        *Как сменить устройство или направление*

        1. Главное меню → «Подключиться»
        2. Выберите направление
        3. Выберите устройство — придёт новый файл или данные

        Прежние настройки продолжат работать.
    pay:
      title: Как оплатить
      text: |
        *Как оплатить*

        1. Главное меню → «Подписка»
        2. Выберите тариф
        3. «По QR‑коду» — отсканируйте код или нажмите «Открыть в банке»
        4. После оплаты бот сам пришлёт подтверждение
    expire:
      title: Что будет, если не продлить
      text: |
        *Что будет, если не продлить*

        В день окончания подписки VPN перестанет работать. Бот заранее напомнит: за 3 дня и за 1 день до окончания, а для тестового доступа — за 1 день. Продлить можно в любой момент — подключение заработает снова.
    devices:
      title: Сколько устройств можно подключить
      text: |
        *Сколько устройств можно подключить*

        Одну подписку можно поставить на ваши личные устройства: iPhone и iPad, Android, Windows, macOS и Linux. Настройки для каждого — в разделе «Подключиться».
  # --------------------------------------------------------
  support:
    url: https://t.me/Techru1
    text: |
      *Поддержка*

      Напишите нам — ответит человек.
  # --------------------------------------------------------
  start:
    text: |
      *Рады снова вас видеть*

      Подписка активна до *%<exp>s* — %<days_left>s.
      Что сделаем?
  # --------------------------------------------------------
  start_expired:
    text: |
      *Подписка закончилась %<date>s*

      Чтобы снова пользоваться VPNRemy, выберите тариф.
  # --------------------------------------------------------
  welcome:
    title: Вы сделали первый шаг к свободному интернету
    invited: "Вас пригласил %<name>s"
    friend: друг
    text: |
      *%<title>s*

      Тестовый доступ на %<trial>s — до *%<exp>s*.

      Выберите, куда подключиться:

      *Открыть мир* — вы в России и хотите пользоваться зарубежными сайтами и сервисами. Подойдут Нидерланды или США.

      *Россия рядом* — вы за границей и хотите пользоваться российскими сервисами: банками, Госуслугами, маркетплейсами.
  # --------------------------------------------------------
  sub_extended:
    text: |
      *Подписка продлена на %<period>s*

      Действует до *%<exp>s*.
      Ничего настраивать не нужно — всё продолжит работать.
  # --------------------------------------------------------
  sub_expired:
    text: |
      *Подписка закончилась %<date>s*

      Чтобы снова пользоваться VPNRemy, выберите тариф. Оплатить можно по QR‑коду (СБП) или в USDT.

      Сделано с любовью к свободному интернету
    # while Setting.usdt_enabled is 0 (T#usdt_get)
    text_no_usdt: |
      *Подписка закончилась %<date>s*

      Чтобы снова пользоваться VPNRemy, выберите тариф. Оплатить можно по QR‑коду (СБП).

      Сделано с любовью к свободному интернету
  # --------------------------------------------------------
  sub_expired_trial:
    text: |
      *Тестовый доступ закончился %<date>s*

      Понравилось? Чтобы и дальше пользоваться VPNRemy, выберите тариф.

      Сделано с любовью к свободному интернету
  # --------------------------------------------------------
  sub_expiring:
    all_plans: Все тарифы
    all_methods: Все способы оплаты
    text: |
      *%<left>s*

      Подписка VPNRemy действует до *%<exp>s*. Продлите заранее — оплаченные дни добавятся к текущим.

      Напоминания можно выключить в настройках.
  # --------------------------------------------------------
  sub_expiring_trial:
    text: |
      *%<left>s тестового доступа*

      Пользоваться VPNRemy бесплатно можно до *%<exp>s*. Чтобы интернет не отключился, выберите тариф заранее.

      Напоминания можно выключить в настройках.
  # --------------------------------------------------------
  subscription:
    ico_yes: ✅
    ico_no: ❌
    menu:
      crypto: USDT (TRC‑20, любая сумма)
      plan_1_mo: 💵 1 месяц - 299.00 RUB
      plan_6_mo: 💵 6 месяцев - 1614.00 RUB
      plan_12_mo: 💵 12 месяцев - 2988.00 RUB
    text: |
      *Ваша подписка активна*

      Действует до *%<exp>s*. Осталось: *%<period>s*.
      Продлить можно заранее — оплаченные дни добавятся к текущим.

      Оплачивая, вы соглашаетесь с [Условиями использования](https://vpnremy.com/terms).
    text_expired: |
      *Подписка закончилась %<date>s*

      Чтобы снова пользоваться VPNRemy, выберите тариф. Оплатить можно по QR‑коду (СБП) или в USDT.

      Оплачивая, вы соглашаетесь с [Условиями использования](https://vpnremy.com/terms).
    # while Setting.usdt_enabled is 0 (T#usdt_get)
    text_expired_no_usdt: |
      *Подписка закончилась %<date>s*

      Чтобы снова пользоваться VPNRemy, выберите тариф. Оплатить можно по QR‑коду (СБП).

      Оплачивая, вы соглашаетесь с [Условиями использования](https://vpnremy.com/terms).
  # --------------------------------------------------------
  payment_options:
    menu:
      pm_stripe_payment: 💳 Карта, WeChat, Alipay, ApplePay, GPay
      pm_stripe_subscription: 💳 Карта (подписка)
      pm_pay2day: По QR‑коду
      pm_ref_balance: С реферального баланса
    text: |
      *Тариф «%<plan>s» — %<price>s*

      Как удобнее оплатить?
  # --------------------------------------------------------
  # Paying by the SBP QR code in the bot (BotController#_pay_qr), a photo with this caption.
  pay_qr:
    caption: |
      *Оплата по QR‑коду*

      Тариф «%<plan>s» — %<price>s.
      Отсканируйте QR‑код в приложении банка. Открыли бота с телефона — нажмите «Открыть в банке».

      Код действует %<ttl>s. После оплаты бот сам пришлёт подтверждение.
    minutes:
      one: "%{count} минуту"
      few: "%{count} минуты"
      many: "%{count} минут"
      other: "%{count} минуты"
    open_bank: Открыть в банке
    check: Проверить оплату
    cancel: Отменить
    pending: |
      *Оплата пока не поступила*

      Если вы уже оплатили — подождите пару минут, бот сам пришлёт подтверждение.
    check_again: Проверить ещё раз
    show: Показать QR‑код
    failed: |
      *Не получилось оплатить*

      Платёж отклонён или ссылка на оплату истекла. Если деньги всё же списались — напишите в поддержку, разберёмся.
    error: |
      *Не получилось создать оплату*

      Попробуйте позже или напишите в поддержку.
    retry: Попробовать снова
    other_method: Другой способ
  # --------------------------------------------------------
  # "Payment received": a paid invoice (BotController.paid_screen) and a USDT deposit.
  paid:
    ref_balance: "%<amount>s с реферального баланса"
    text: |
      *Подписка продлена*

      Тариф: *%<plan>s*
      Оплачено: *%<amount>s*
      Действует до: *%<exp>s*

      Ничего настраивать не нужно — всё продолжит работать.

      Сделано с любовью к свободному интернету
    usdt: |
      *Подписка продлена*

      Получено: *%<amount>s*
      Продлено на: *%<period>s*
      Действует до: *%<exp>s*

      Ничего настраивать не нужно — всё продолжит работать.

      Сделано с любовью к свободному интернету
  # --------------------------------------------------------
  # USDT (TRC-20): the deposit address; `unavailable` while Setting.usdt_enabled is 0.
  usdt:
    menu: В USDT (TRC‑20)
    text: |
      *Пополнение в USDT (TRC‑20)*

      Переведите любую сумму на ваш личный адрес ниже — подписка продлится на соответствующее число дней.

      `%<addr>s`

      Отправляйте только USDT в сети TRC‑20 — другие монеты и сети не зачислятся. Зачисление занимает несколько минут.
    copy: Скопировать адрес
    check: Проверить зачисление
    not_yet: Пока не поступило. Зачисление занимает несколько минут — бот сам пришлёт подтверждение.
    preparing: |
      *Готовим ваш адрес USDT*

      Нажмите «Показать адрес» через минуту.
    show: Показать адрес
    unavailable: |
      *Оплата в USDT временно недоступна*

      Оплатите по QR‑коду или напишите в поддержку — поможем.
  # --------------------------------------------------------
  ref_pay_confirm:
    text: |
      *💰 Оплата с реферального баланса*

      Списать *%<amount>s* с реферального баланса за тариф «%<plan>s»?

      Доступно: *%<available>s*
  # --------------------------------------------------------
  ref_pay_short:
    text: |
      *💰 Не хватает %<missing>s* на реферальном балансе.

      Доступно: *%<available>s*. Выберите другой тариф или способ оплаты.
  # --------------------------------------------------------
  ref_pay_done:
    text: |
      ✅ *Оплачено с реферального баланса:* %<amount>s

      Подписка действует до *%<exp>s*.
  # --------------------------------------------------------
  plan_unknown:
    text: |
      План отключен или неизвестен! Запустите команду /subscription, чтобы узнать доступные для покупки планы.
  # --------------------------------------------------------
  sub_crypto:
    text: |
      *Ваш адрес для пополнения TRC-20*:

      `%<addr_trc20>s`
      (нажмите, чтобы скопировать)

      Депозиты в USDT рассчитываются как USD в соответствии с эффективным ценообразованием. Например, если вы хотите заплатить за 12 месяцев, просто переведите `49.99` USDT. Вы можете перевести любую сумму, которую хотите, и срок окончания подписки будет рассчитан пропорционально.

      Мы ждем *20 подтверждений* для обработки транзакции, поэтому вам придется подождать некоторое время. После обработки транзакции вы получите уведомление с подтверждением вашего депозита. Если ваш депозит не был зачислен, не стесняйтесь написать нам в @Techru1.
  # --------------------------------------------------------
  config:
    text: |
      *Выберите, куда подключиться*

      *Открыть мир* — вы в России и хотите пользоваться зарубежными сайтами и сервисами. Подойдут Нидерланды или США.

      *Россия рядом* — вы за границей и хотите пользоваться российскими сервисами: банками, Госуслугами, маркетплейсами.
  # --------------------------------------------------------
  # Server names and groups (Host#display_name, Host.grouped); the records are shared by all brands.
  hosts:
    names:
      eu_nl_1: "🇳🇱 Нидерланды"
      usa_fremont_1: "🇺🇸 США"
      ru_saint_petersburg_1: "🇷🇺 Россия — Санкт-Петербург"
      eu_ru_nl_1: "🇳🇱 Нидерланды (через Россию)"
      eu_ru_us_1: "🇺🇸 США (через Россию)"
    groups:
      - title: "Прямое подключение"
        hint: "попробуйте сначала его"
        hosts: [eu_nl_1, usa_fremont_1, ru_saint_petersburg_1]
      - title: "Через Россию"
        hint: "если прямое подключение не работает"
        hosts: [eu_ru_nl_1, eu_ru_us_1]
  # --------------------------------------------------------
  config_manual:
    text: |
      *Ваши учетные данные*

      Имя пользователя: `%<username>s`

      Пароль: `%<password>s`
  # --------------------------------------------------------
  config_not_found:
    text: |
      Конфигурация не найдена!
  # --------------------------------------------------------
  config_apple:
    text: |
      *Конфигурация «%<server>s» для iPhone, iPad или Mac готова*

      Скачайте файл и откройте его — устройство предложит установить профиль.
      iPhone и iPad: «Настройки» → «Профиль загружен» → «Установить».
      Mac: «Системные настройки» → «Конфиденциальность и безопасность» → «Профили» → «Установить».
      Затем включите VPN в настройках.
  # --------------------------------------------------------
  config_iphone:
    text: |
      *Конфигурация «%<server>s» для iPhone готова*

      Скачайте файл и откройте его — iPhone предложит установить профиль.
  # --------------------------------------------------------
  config_mac:
    text: |
      *Конфигурация «%<server>s» для Mac готова*

      Скачайте файл и откройте его — Mac предложит установить профиль.
  # --------------------------------------------------------
  config_android:
    text: |
      *Конфигурация «%<server>s» для Android готова*

      1. Установите приложение [strongSwan](https://play.google.com/store/apps/details?id=org.strongswan.android) из Google Play
      2. Сохраните файл на телефон
      3. В strongSwan: меню ⋮ → «Импорт VPN‑профиля» → выберите файл

      Логин: `%<username>s`
      Пароль: `%<password>s`

      Понадобятся, если strongSwan попросит их при подключении. Никому не пересылайте — по ним можно пользоваться вашей подпиской.
  # --------------------------------------------------------
  config_custom:
    text: |
      *Подключение «%<server>s» для Windows*

      Для Windows файл не нужен — VPN встроен в систему. Введите эти данные в настройках VPN. Нажмите на значение, чтобы скопировать.

      Сервер: `%<host>s`
      Логин: `%<username>s`
      Пароль: `%<password>s`

      Никому не пересылайте логин и пароль — по ним можно пользоваться вашей подпиской.
  # --------------------------------------------------------
  config_linux:
    text: |
      *Подключение «%<server>s» для Linux*

      Для Linux файл не нужен — подключение настраивается в NetworkManager. Введите эти данные в настройках VPN. Нажмите на значение, чтобы скопировать.

      Сервер: `%<host>s`
      Логин: `%<username>s`
      Пароль: `%<password>s`

      Никому не пересылайте логин и пароль — по ним можно пользоваться вашей подпиской.
  # --------------------------------------------------------
  # The first /start, the guides after a config, "you are connected" (the first VPN login).
  onboarding:
    # the buttons of the first /start; a host missing from the database is not shown
    directions:
      - host: eu_nl_1
        title: 🇳🇱 Открыть мир через Нидерланды
      - host: usa_fremont_1
        title: 🇺🇸 Открыть мир через США
      - host: ru_saint_petersburg_1
        title: 🇷🇺 Подключиться в Россию
    # the name of the file the customer gets, without the extension
    file: "VPNRemy-%<server>s"
    guide_iphone: |
      *Как подключиться на iPhone*

      1. Нажмите на файл %<file>s выше и разрешите загрузку профиля
      2. Откройте Настройки → «Профиль загружен» → «Установить»
      3. Включите VPN: Настройки → VPN → VPNRemy

      Как только подключитесь, бот сам пришлёт подтверждение.
    guide_mac: |
      *Как подключиться на Mac*

      1. Откройте файл %<file>s из сообщения выше
      2. Системные настройки → «Конфиденциальность и безопасность» → «Профили» → «Установить»
      3. Включите VPN: Системные настройки → VPN → VPNRemy

      Как только подключитесь, бот сам пришлёт подтверждение.
    guide_android: |
      *Как подключиться на Android*

      1. Установите приложение [strongSwan](https://play.google.com/store/apps/details?id=org.strongswan.android) из Google Play
      2. Сохраните файл %<file>s из сообщения выше на телефон
      3. Откройте strongSwan → меню ⋮ → «Импорт VPN‑профиля» → выберите файл
      4. Нажмите на профиль VPNRemy. Если попросит — введите логин и пароль из сообщения выше

      Как только подключитесь, бот сам пришлёт подтверждение.
    guide_custom: |
      *Как подключиться на Windows 10 и 11*

      1. Откройте Параметры → Сеть и Интернет → VPN → «Добавить VPN»
      2. Поставщик — «Windows (встроенные)», имя — VPNRemy, адрес сервера — из сообщения выше
      3. Тип VPN — IKEv2, вход — «Имя пользователя и пароль». Введите логин и пароль → «Сохранить»
      4. Нажмите VPNRemy → «Подключиться»

      Как только подключитесь, бот сам пришлёт подтверждение.
    guide_linux: |
      *Как подключиться на Linux*

      1. Установите модуль strongSwan для NetworkManager. Ubuntu и Debian: `sudo apt install network-manager-strongswan`
      2. Откройте Настройки → Сеть → VPN → «+» → «IPsec/IKEv2 (strongswan)», имя — VPNRemy
      3. Сервер — адрес из сообщения выше. Сертификат не указывайте
      4. Аутентификация — EAP. Введите логин и пароль из сообщения выше, отметьте «Запросить внутренний IP‑адрес» → «Добавить»
      5. Включите VPN VPNRemy

      Как только подключитесь, бот сам пришлёт подтверждение.

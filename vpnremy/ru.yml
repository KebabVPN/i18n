    platform_apple:  Apple (iOS, MacOS)
    platform_android: 📱 Android
    platform_custom: 🔑 Другое
  # --------------------------------------------------------
  platforms:
    text: |
      *Выберите вашу платформу:*

      Выберите операционную систему, которую вы хотите настроить. Вам будут предоставлены учетные данные и файлы конфигурации, необходимые для использования. Пожалуйста, будьте внимательны, так как может быть отображена чувствительная информация.
  # --------------------------------------------------------
  help:
    text: |
      *Доступные команды:*

      🏠 /start - Запустите бота и зарегистрируйтесь

      ⚙️ /config - Управление конфигурациями

      💸 /subscription - Управление вашей подпиской

      🌎 /lang - Управление языком бота

      🔧 /settings - Управление настройками

      ℹ️ /help - Получить список команд

      🤖 @Techru1 - Получить поддержку
  # --------------------------------------------------------
  start:
    text: |
      *🌟 Добро пожаловать! 🌟*

      Благодарим вас за выбор [VPNRemy](https://vpnremy.com). Для начала использования VPN нажмите кнопку *Конфигурации* ниже, и вы получите файл конфигурации, который нужно установить на ваше устройство. Подробное руководство доступно на https://vpnremy.com. Все опции доступны по команде /help.
  # --------------------------------------------------------
  sub_extended:
    text: |
      🌟 *Поздравляем!* 🌟

      Вы получили *%<days>s* дней использования VPN! Не стесняйтесь написать нам свой отзыв в @Techru1! 🫶

      Ваша подписка заканчивается: *%<exp>s*
  # --------------------------------------------------------
  sub_expired:
    text: |
      ❌ *Подписка истекла!* ❌

      Мы сожалеем об истечении срока вашей подписки *%<exp>s*

      Вам нужно выполнить команду /subscription, чтобы продолжить использование услуг.

      Пожалуйста, напишите нам в @Techru1, если у вас есть вопросы! 🫶
  # --------------------------------------------------------
  sub_expiring:
    text: |
      ⏰ *Подписка скоро закончится* ⏰

      До окончания подписки осталось дней: *%<days>s*. Дата окончания: *%<exp>s*

      Чтобы VPN работал без перерыва, продлите подписку командой /subscription.

      Если есть вопросы, пишите нам в @Techru1! 🫶
  # --------------------------------------------------------
  subscription:
    ico_yes: ✅
    ico_no: ❌
    menu:
      crypto: 🤑 USDT (TRC-20, любая сумма)
      plan_1_mo: 💵 1 месяц - 299.00 RUB
      plan_6_mo: 💵 6 месяцев - 1614.00 RUB
      plan_12_mo: 💵 12 месяцев - 2988.00 RUB
    text: |
      *Ваша подписка:*

      Дата окончания: *%<exp>s* %<ico>s (активных дней %<days>s)
      Проведя оплату, вы соглашаетесь с нашими [Условиями использования](https://vpnremy.com/terms).
  # --------------------------------------------------------
  payment_options:
    menu:
      pm_stripe_payment: 💳 Карта, WeChat, Alipay, ApplePay, GPay
      pm_stripe_subscription: 💳 Карта (подписка)
      pm_pay2day: 🇷🇺 СБП (RUB)
    text: |
      *Ваша подписка:*

      Дата окончания: *%<exp>s* %<ico>s (активных дней %<days>s)
      Проведя оплату, вы соглашаетесь с нашими [Условиями использования](https://vpnremy.com/terms).

      Вы покупаете: *%<description>s*

      Пожалуйста, выберите метод оплаты:
  # --------------------------------------------------------
  plan_unknown:
    text: |
      План отключен или неизвестен! Запустите команду /subscription, чтобы узнать доступные для покупки планы.
  # --------------------------------------------------------
  sub_crypto:
    text: |
      *Ваш адрес для пополнения TRC-20*:

      `%<addr_trc20>s`
      (нажмите, чтобы скопировать)

      Депозиты в USDT рассчитываются как USD в соответствии с эффективным ценообразованием. Например, если вы хотите заплатить за 12 месяцев, просто переведите `49.99` USDT. Вы можете перевести любую сумму, которую хотите, и срок окончания подписки будет рассчитан пропорционально.

      Мы ждем *20 подтверждений* для обработки транзакции, поэтому вам придется подождать некоторое время. После обработки транзакции вы получите уведомление с подтверждением вашего депозита. Если ваш депозит не был зачислен, не стесняйтесь написать нам в @Techru1.
  # --------------------------------------------------------
  config:
    text: |
      *Выберите местоположение:*

      Выберите местоположение, для которого вы хотите настроить конфигурацию VPN. Вас попросят указать используемую операционную систему.
  # --------------------------------------------------------
  config_manual:
    text: |
      *Ваши учетные данные*

      Имя пользователя: `%<username>s`

      Пароль: `%<password>s`
  # --------------------------------------------------------
  config_not_found:
    text: |
      Конфигурация не найдена!
  # --------------------------------------------------------
  config_apple:
    text: |
      Пожалуйста, загрузите файл и установите его на свое устройство. После установки файла вам нужно подтвердить установку профиля в настройках системы.
  # --------------------------------------------------------
  config_android:
    text: |
      Пожалуйста, загрузите файл и откройте его с использованием приложения https://play.google.com/store/apps/details?id=org.strongswan.android
      Вам будут предложены ввести имя пользователя и пароль, которые указаны ниже.

      Имя пользователя:
      `%<username>s`

      Пароль:
      `%<password>s`

      (нажмите, чтобы скопировать ^^)
  # --------------------------------------------------------
  config_custom:
    text: |
      *Настройки по умолчанию*

      Вы можете подключиться, используя системные настройки и следующие учетные данные:

      Имя подключения: `%<name>s`

      Тип: `%<type>s`

      Сервер: `%<host>s`

      Идентификатор сервера: `%<host>s`

      Идентификатор IPSec: `%<username>s`

      Имя пользователя: `%<username>s`

      Пароль: `%<password>s`

      CA-сертификат: (оставьте пустым, не используется)

      Сертификат сервера: (оставьте пустым, не используется)
  # --------------------------------------------------------
  lang:
    text: |
      *🌎 Выберите свой язык:*
    en: 🇬🇧 English
    ru: 🇷🇺 Русский
    tr: 🇹🇷 Türkiye
    zh: 🇨🇳 中文
    fa: 🇮🇷 فارسی
  # --------------------------------------------------------
  lang_custom:
    text: |
      *🔧 Новый язык*

      Пожалуйста, не стесняйтесь вносить свой вклад, чтобы изучить больше языков или исправить ошибки. Дополнительная информация доступна на странице: https://github.com/KebabVPN/i18n
  # --------------------------------------------------------
  referral:
    text: |
      *💰 Реферал*

      Ваш персональный пригласительный ссылка: `%<link>s`
      Нажмите, чтобы скопировать и отправить друзьям!

      Приглашенные пользователи: *%<users_invited_count>s*
      Баланс реферала: *%<ref_balance_usd>s*
      Ставка получения денег: *%<ref_money_percent>s*

      Свяжитесь с @Techru1, чтобы предоставить ваши реквизиты для вывода денег.
  # --------------------------------------------------------
  cabinet:
    text: |
      *👤 Личный кабинет*

      Нажмите кнопку ниже, чтобы войти. Ссылка одноразовая и действует 10 минут.
  # --------------------------------------------------------
  referral_v2:
    example: "С подписки за %<price>s вы получите %<reward>s."
    example_fixed: "С каждой оплаты вашего клиента вы получите %<reward>s."
    friend: "Друг получит %<bonus>s к первой оплате."
    text: |
      *💰 Реферал*

      Ваша пригласительная ссылка: `%<link>s`
      Ваш промокод: `%<code>s`
      Нажмите, чтобы скопировать, и отправьте друзьям: они получат бонус к первой оплате, а вы — вознаграждение с каждой их оплаты.

      Вы получаете 60%% вознаграждения с оплат ваших клиентов, 30%% — с клиентов ваших клиентов, 10%% — с третьей линии.
      %<terms>s
      Баланс: доступно *%<available>s*, в холде *%<on_hold>s*.

      Статистика, баланс и вывод средств — в личном кабинете.
  # --------------------------------------------------------
  referral_v2_inactive:
    text: |
      *💰 Реферал*

      Партнёрская программа станет доступна после первой оплаты. Тогда здесь и в личном кабинете появятся ваша ссылка и промокод.
  # --------------------------------------------------------
  promo_templates:
    text: |
      *🎟 Промокоды*

      Выберите акцию для новых промокодов:
  # --------------------------------------------------------
  promo_templates_empty:
    text: |
      *🎟 Промокоды*

      Сейчас нет доступных акций. Загляните позже.
  # --------------------------------------------------------
  promo_count:
    text: |
      *🎟 %<name>s*

      Сколько промокодов создать? Каждый код одноразовый и без срока действия.
  # --------------------------------------------------------
  promo_codes:
    text: |
      *🎟 %<name>s*

      Создано промокодов: %<count>s

      %<codes>s

      Нажмите на код, чтобы скопировать. Все ваши коды и их использование — в личном кабинете.
  # --------------------------------------------------------
  promo_codes_file:
    text: |
      *🎟 %<name>s*

      Создано промокодов: %<count>s. Список — в файле.
  # --------------------------------------------------------
  settings:
    text: |
      *🔧 Настройки*
  # --------------------------------------------------------
  unknown:
    text: |
      Неизвестная команда, выполните /help, чтобы получить список всех доступных команд!
  # --------------------------------------------------------
  promo_enter:
    text: |
      *🎟 Промокод*

      Отправьте промокод одним сообщением.
  # --------------------------------------------------------
  promo_applied:
    text: |
      ✅ Промокод `%<code>s` применён: %<bonus>s — сработает при оплате по СБП или разовой оплате картой.
  # --------------------------------------------------------
  promo_current:
    text: |
      🎟 Применён промокод `%<code>s`: %<bonus>s
  # --------------------------------------------------------
  promo:
    bonus_percent: "−%<value>s%%"
    bonus_days: "+%<count>s дн."
    errors:
      not_found: "❌ Такого промокода нет."
      expired: "❌ Срок действия промокода истёк."
      used_up: "❌ Этот промокод уже использован."
      own_code: "❌ Нельзя использовать свой промокод."
      already_used: "❌ Вы уже получали бонус по промокоду."

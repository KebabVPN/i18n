  # --------------------------------------------------------
  platforms:
    text: |
      *Choose your device*

      The "%<server>s" location is selected. Which device will you use VPNRemy on? Each one gets its own setup.
  # --------------------------------------------------------
  help:
    text: |
      *How can we help?*

      Can't find an answer? Message support, a human will reply.

      /start — main menu
      /config — connect
      /subscription — subscription
      /referral — invite friends
      /support — support
      /help — this help
  # --------------------------------------------------------
  # the support link of /support; the text is shared, see default/en.yml
  support:
    url: https://t.me/Techru1
  # --------------------------------------------------------
  start:
    text: |
      *Welcome back!*

      Your subscription is active until *%<exp>s* — %<days_left>s.
      What shall we do?
  # --------------------------------------------------------
  sub_extended:
    text: |
      ✅ *Your subscription is extended by %<period>s*

      Valid until *%<exp>s*.
      Nothing to set up — everything keeps working.
  # --------------------------------------------------------
  sub_expired:
    text: |
      ❌ *Your subscription ended on %<date>s*

      To use VPNRemy again, choose a plan. You can pay by QR code (SBP) or in USDT.
  # --------------------------------------------------------
  sub_expiring:
    text: |
      ⏰ *%<left>s*

      Your VPNRemy subscription is valid until *%<exp>s*. Renew in advance — the paid days are added to the current ones.

      Reminders can be turned off in the settings.
  # --------------------------------------------------------
  subscription:
    ico_yes: ✅
    ico_no: ❌
    menu:
      crypto: 🤑 USDT (TRC‑20, any amount)
      plan_1_mo: 💵 1 Month - 299.00 RUB
      plan_6_mo: 💵 6 Months - 1614.00 RUB
      plan_12_mo: 💵 12 Months - 2988.00 RUB
    text: |
      *Your subscription is active* %<ico>s

      Valid until *%<exp>s*. Left: *%<period>s*.
      You can renew in advance — the paid days are added to the current ones.

      If you change your mind, we refund within 14 days of the first payment. By paying you agree with our [Terms and Conditions](https://vpnremy.com/terms).
    text_expired: |
      *Your subscription ended on %<date>s*

      To use VPNRemy again, choose a plan. You can pay by QR code (SBP) or in USDT.

      If you change your mind, we refund within 14 days of the first payment. By paying you agree with our [Terms and Conditions](https://vpnremy.com/terms).
  # --------------------------------------------------------
  payment_options:
    menu:
      pm_stripe_payment: 💳 Card, WeChat, Alipay, ApplePay, GPay
      pm_stripe_subscription: 💳 Card (subscription)
      pm_pay2day: 📷 By QR code (SBP)
      pm_ref_balance: 💰 From the referral balance
    text: |
      *The "%<plan>s" plan — %<price>s*

      How would you like to pay?
  # --------------------------------------------------------
  ref_pay_confirm:
    text: |
      *💰 Paying from the referral balance*

      Take *%<amount>s* from your referral balance for the "%<plan>s" plan?

      Available: *%<available>s*
  # --------------------------------------------------------
  ref_pay_short:
    text: |
      *💰 Your referral balance is %<missing>s short.*

      Available: *%<available>s*. Choose another plan or payment method.
  # --------------------------------------------------------
  ref_pay_done:
    text: |
      ✅ *Paid from the referral balance:* %<amount>s

      Your subscription is valid until *%<exp>s*.
  # --------------------------------------------------------
  plan_unknown:
    text: |
      Plan is disabled or unknown! Run /subscription command to get plans available for purchase.
  # --------------------------------------------------------
  sub_crypto:
    text: |
      *Your top-up TRC-20 address*:

      `%<addr_trc20>s`
      (click to copy)

      USDT deposits are calculated like USD according to effective pricing. For example, if you want to pay for 12 months, just transfer `49.99` USDT. You may transfer any amount you want, the subscription end date will be calculated accordingly in a proportion.

      We wait for *20 confirmations* for transaction to be processed, so you have to wait for a while. Once the transaction is processed, you will receive a notification with confirmation of your deposit. If your deposit is not credited, feel free to write us in @Techru1.
  # --------------------------------------------------------
  config:
    text: |
      *Choose Location:*

      Please choose the location you want to setup VPN configuration for. You will be asked for an operating system you use.
  # --------------------------------------------------------
  # Server names and groups (Host#display_name, Host.grouped); the records are shared by all brands.
  hosts:
    names:
      eu_nl_1: "🇳🇱 Netherlands"
      usa_fremont_1: "🇺🇸 USA"
      ru_saint_petersburg_1: "🇷🇺 Russia — Saint Petersburg"
      eu_ru_nl_1: "🇳🇱 Netherlands (via Russia)"
      eu_ru_us_1: "🇺🇸 USA (via Russia)"
    groups:
      - title: "Direct connection"
        hint: "try it first"
        hosts: [eu_nl_1, usa_fremont_1, ru_saint_petersburg_1]
      - title: "Via Russia"
        hint: "if the direct connection does not work"
        hosts: [eu_ru_nl_1, eu_ru_us_1]
  # --------------------------------------------------------
  config_manual:
    text: |
      *Your Credentials*

      Username: `%<username>s`

      Password: `%<password>s`
  # --------------------------------------------------------
  config_not_found:
    text: |
      Configuration is not found!
  # --------------------------------------------------------
  config_apple:
    text: |
      *The "%<server>s" configuration for iPhone, iPad or Mac is ready*

      Download the file and open it — the device will offer to install the profile.
      iPhone and iPad: Settings → "Profile Downloaded" → "Install".
      Mac: System Settings → "Privacy & Security" → "Profiles" → "Install".
      Then turn the VPN on in the settings.
  # --------------------------------------------------------
  config_iphone:
    text: |
      *The "%<server>s" configuration for iPhone is ready*

      Download the file and open it — the iPhone will offer to install the profile.
  # --------------------------------------------------------
  config_mac:
    text: |
      *The "%<server>s" configuration for Mac is ready*

      Download the file and open it — the Mac will offer to install the profile.
  # --------------------------------------------------------
  config_android:
    text: |
      *The "%<server>s" configuration for Android is ready*

      1. Install the [strongSwan](https://play.google.com/store/apps/details?id=org.strongswan.android) app from Google Play
      2. Save the file to your phone
      3. In strongSwan: menu ⋮ → "Import VPN profile" → choose the file

      Login: `%<username>s`
      Password: `%<password>s`

      You will need them if strongSwan asks when connecting. Do not share them — they give access to your subscription.
  # --------------------------------------------------------
  config_custom:
    text: |
      *The "%<server>s" connection for Windows*

      Windows needs no file — the VPN is built into the system. Enter these details in the VPN settings. Tap a value to copy it.

      Server: `%<host>s`
      Login: `%<username>s`
      Password: `%<password>s`

      Do not share the login and password — they give access to your subscription.
  # --------------------------------------------------------
  # The first /start, the guides after a config, "you are connected" (the first VPN login).
  # The buttons and the welcome are shared, see default/en.yml.
  onboarding:
    file: "VPNRemy-%<server>s"
    guide_iphone: |
      *How to connect on iPhone*

      1. Tap the file %<file>s above and allow the profile to download
      2. Open Settings → "Profile Downloaded" → "Install"
      3. Turn the VPN on: Settings → VPN → VPNRemy

      As soon as you connect, the bot will confirm it.
    guide_mac: |
      *How to connect on Mac*

      1. Open the file %<file>s from the message above
      2. System Settings → "Privacy & Security" → "Profiles" → "Install"
      3. Turn the VPN on: System Settings → VPN → VPNRemy

      As soon as you connect, the bot will confirm it.
    guide_android: |
      *How to connect on Android*

      1. Install the [strongSwan](https://play.google.com/store/apps/details?id=org.strongswan.android) app from Google Play
      2. Save the file %<file>s from the message above to your phone
      3. Open strongSwan → menu ⋮ → "Import VPN profile" → choose the file
      4. Tap the VPNRemy profile. If asked, enter the login and password from the message above

      As soon as you connect, the bot will confirm it.
    guide_custom: |
      *How to connect on Windows 10 and 11*

      1. Open Settings → Network & Internet → VPN → "Add VPN"
      2. Provider — "Windows (built-in)", name — VPNRemy, server address — from the message above
      3. VPN type — IKEv2, sign-in — "User name and password". Enter the login and password → "Save"
      4. Tap VPNRemy → "Connect"

      As soon as you connect, the bot will confirm it.
    connected_trial: |
      *Done, you are connected to VPNRemy*

      You have trial access for %<period>s. You can use VPNRemy until *%<exp>s*.
      When the trial ends, you can renew the subscription in one of the ways below.
    connected: |
      *Done, you are connected to VPNRemy*

      Your subscription is valid until *%<exp>s*.

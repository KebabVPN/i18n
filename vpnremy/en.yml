      %<rates>s
      %<terms>s
      Balance: *%<available>s* available, *%<on_hold>s* on hold.
      Withdrawals are in USDT, in your personal account. Statistics are there too.
  # --------------------------------------------------------
  referral_v2_inactive:
    text: |

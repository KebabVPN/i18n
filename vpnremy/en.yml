  # --------------------------------------------------------
  # The first /start, the guides after a config, "you are connected" (the first VPN login).
  # The buttons and the welcome are shared, see default/en.yml.
  onboarding:
    file: "VPNRemy-%<server>s"
    setup:
      android_credentials_hint: "If strongSwan asks for a username and password, enter these credentials"
      ready: "Configuration ready"
      download: "Download configuration"
      back: "Choose another device"
      manual_title: "Connection details"
      checks_title: "If it does not connect"
      checks:
        - "Check your subscription and your username and password."
        - "Try another server or another network."
        - "Check your device's date and time. Reinstall the profile if needed."
      confirmation: "The bot will confirm your first connection. Need help? Message @vpnremy_support_bot."
      iphone:
        title: "Connect on iPhone or iPad"
        steps:
          - "Download the profile. If it does not open, save it to Files and open it there."
          - "Open Settings → Profile Downloaded. If you do not see it, open General → VPN & Device Management."
          - "Tap Install and enter your device passcode."
          - "Open Settings → VPN and turn on VPNRemy."
      mac:
        title: "Connect on macOS"
        steps:
          - "Download the profile and double-click the file."
          - "Find Profiles in System Settings. Its location depends on your macOS version."
          - "Open the VPNRemy profile, click Install, and enter your Mac password."
          - "Open System Settings → VPN and turn on VPNRemy."
      android:
        title: "Connect on Android"
        steps:
          - "Install strongSwan VPN Client from Google Play: https://play.google.com/store/apps/details?id=org.strongswan.android"
          - "Download the file. Open it with strongSwan, or choose Import VPN profile from the app menu."
          - "If asked, enter the username and password from the configuration message. Tap Import or Save."
          - "Tap the VPNRemy profile and allow the VPN connection."
      custom:
        title: "Connect on Windows 10 or 11"
        steps:
          - "Open Settings → Network & Internet → VPN → Add VPN."
          - "Choose Windows (built-in), enter VPNRemy as the name, and enter the server address in the connection details."
          - "Choose IKEv2 and Username and password. Enter the connection details and save."
          - "Choose VPNRemy and click Connect."
      linux:
        title: "Connect on Linux"
        steps:
          - "Install the strongSwan plugin for NetworkManager. Ubuntu and Debian: sudo apt install network-manager-strongswan"
          - "Open Settings → Network → VPN → + → IPsec/IKEv2 (strongswan)."
          - "Enter the server address in the connection details. Leave the certificate field empty."
          - "Choose EAP authentication, enter the username and password, select Request an inner IP address, and save."
          - "Turn on the VPNRemy profile."
      important: "Turn VPN on and off in your device settings or in strongSwan on Android. On-demand activation is disabled in the iPhone and Mac configuration. After a connection drops, the system or app may try to reconnect. Do not share the file, username or password: they give access to your subscription."
    guide_iphone: |
      *How to connect on iPhone*

      1. Tap the file %<file>s above and allow the profile to download
      2. Open Settings → "Profile Downloaded" → "Install"
      3. Turn the VPN on: Settings → VPN → VPNRemy

      As soon as you connect, the bot will confirm it.
    guide_mac: |
      *How to connect on Mac*

      1. Open the file %<file>s from the message above
      2. System Settings → "Privacy & Security" → "Profiles" → "Install"
      3. Turn the VPN on: System Settings → VPN → VPNRemy

      As soon as you connect, the bot will confirm it.
    guide_android: |
      *How to connect on Android*

      1. Install the [strongSwan](https://play.google.com/store/apps/details?id=org.strongswan.android) app from Google Play
      2. Save the file %<file>s from the message above to your phone
      3. Open strongSwan → menu ⋮ → "Import VPN profile" → choose the file
      4. Tap the VPNRemy profile. If asked, enter the login and password from the message above

      As soon as you connect, the bot will confirm it.
    guide_custom: |
      *How to connect on Windows 10 and 11*

      1. Open Settings → Network & Internet → VPN → "Add VPN"
      2. Provider — "Windows (built-in)", name — VPNRemy, server address — from the message above
      3. VPN type — IKEv2, sign-in — "User name and password". Enter the login and password → "Save"
      4. Tap VPNRemy → "Connect"

      As soon as you connect, the bot will confirm it.
    guide_linux: |
      *How to connect on Linux*

      1. Install the strongSwan plugin for NetworkManager. Ubuntu and Debian: `sudo apt install network-manager-strongswan`
      2. Open Settings → Network → VPN → "+" → "IPsec/IKEv2 (strongswan)", name — VPNRemy
      3. Server — the address from the message above. Leave the certificate empty
      4. Authentication — EAP. Enter the login and password from the message above, tick "Request an inner IP address" → "Add"
      5. Turn VPNRemy on

      As soon as you connect, the bot will confirm it.
    connected_trial: |
      *Done, you are connected to VPNRemy*

      You have trial access for %<period>s. You can use VPNRemy until *%<exp>s*.
      When the trial ends, you can renew the subscription in one of the ways below.

      Made with love for the free internet
    connected: |
      *Done, you are connected to VPNRemy*

      Your subscription is valid until *%<exp>s*.

      Made with love for the free internet

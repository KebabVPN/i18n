    subscription_back_short: 💸 Return Back
    lang: 🌎 Language
    lang_back: 🌎 Back to languages
    lang_custom: 🔧 New Language
    help: ℹ️ Help
    delete_message: 🥷 Delete Message
    settings: 🔧 Settings
    settings_notifications_enable: 🔕 Enable Notifications
    settings_notifications_disable: 🔔 Disable Notifications
    subscription_management_stripe: 💸 Subscription (Stripe)
    referral: 💰 Referral
    cabinet: 👤 Personal account
    cabinet_open: 🔐 Sign in to your account
    promo_generate: 🎟 Generate promo codes
    promo_enter: 🎟 Enter promo code
    platform_apple:  Apple (iOS, MacOS)
    platform_android: 📱 Android
    platform_custom: 🔑 Other
  # --------------------------------------------------------
  platforms:
    text: |
      *Choose your platform:*

      Choose the operating system you want to setup. You will get credentials and configuration files you need to use. Please be careful, a sensitive information might be displayed.
  # --------------------------------------------------------
  help:
    text: |
      *Available commands:*

      🏠 /start - Start the bot and register

      ⚙️ /config - Manage configurations

      💸 /subscription - Manage your subscription

      🌎 /lang - Manage the bot language

      🔧 /settings - Manage the settings

      ℹ️ /help - Get the commands list

      🤖 @Techru1 - Get a support
  # --------------------------------------------------------
  start:
    text: |
      *🌟 Welcome! 🌟*

      Thank you for choosing [VPNRemy](https://vpnremy.com). To start using VPN, you need to press the *Configurations* button below and you will get the configuration file which you need to install to your device. Detailed guide is available at https://vpnremy.com. All options are available by running /help command.
  # --------------------------------------------------------
  sub_extended:
    text: |
      🌟 *Congratulations!* 🌟

      You have got *%<days>s* days of VPN usage! Feel free to write us your feedback in @Techru1! 🫶

      Your subscription ends at: *%<exp>s*
  # --------------------------------------------------------
  sub_expired:
    text: |
      ❌ *Subscription Expired!* ❌

      We're sorry to find your subscription expired at *%<exp>s*

      You need to follow /subscription command to continue using services.

      Please write us to @Techru1 if you have any questions! 🫶
  # --------------------------------------------------------
  sub_expiring:
    text: |
      ⏰ *Your subscription ends soon* ⏰

      Days left: *%<days>s*. Your subscription ends at: *%<exp>s*

      Renew it with the /subscription command to keep your VPN running without interruption.

      Please write us to @Techru1 if you have any questions! 🫶
  # --------------------------------------------------------
  subscription:
    ico_yes: ✅
    ico_no: ❌
    menu:
      crypto: 🤑 Pay using USDT (TRC-20, any amount)
      plan_1_mo: 💵 1 Month - 299.00 RUB
      plan_6_mo: 💵 6 Months - 1614.00 RUB
      plan_12_mo: 💵 12 Months - 2988.00 RUB
    text: |
      *Your subscription:*

      Expiration date: *%<exp>s* %<ico>s (%<days>s active days)
      By making a payment you agree with our [Terms and Conditions](https://vpnremy.com/terms).
  # --------------------------------------------------------
  payment_options:
    menu:
      pm_stripe_payment: 💳 Card, WeChat, Alipay, ApplePay, GPay
      pm_stripe_subscription: 💳 Card (subscription)
      pm_pay2day: 🇷🇺 SBP (RUB)
    text: |
      *Your subscription:*

      Expiration date: *%<exp>s* %<ico>s (%<days>s active days)
      By making a payment you agree with our [Terms and Conditions](https://vpnremy.com/terms).

      You're buying: *%<description>s*

      Please, choose payment method:
  # --------------------------------------------------------
  plan_unknown:
    text: |
      Plan is disabled or unknown! Run /subscription command to get plans available for purchase.
  # --------------------------------------------------------
  sub_crypto:
    text: |
      *Your top-up TRC-20 address*:

      `%<addr_trc20>s`
      (click to copy)

      USDT deposits are calculated like USD according to effective pricing. For example, if you want to pay for 12 months, just transfer `49.99` USDT. You may transfer any amount you want, the subscription end date will be calculated accordingly in a proportion.

      We wait for *20 confirmations* for transaction to be processed, so you have to wait for a while. Once the transaction is processed, you will receive a notification with confirmation of your deposit. If your deposit is not credited, feel free to write us in @Techru1.
  # --------------------------------------------------------
  config:
    text: |
      *Choose Location:*

      Please choose the location you want to setup VPN configuration for. You will be asked for an operating system you use.
  # --------------------------------------------------------
  config_manual:
    text: |
      *Your Credentials*

      Username: `%<username>s`

      Password: `%<password>s`
  # --------------------------------------------------------
  config_not_found:
    text: |
      Configuration is not found!
  # --------------------------------------------------------
  config_apple:
    text: |
      Please download the file and install it to your device. Once the file is installed you need to confirm the installation of a profile in system settings.
  # --------------------------------------------------------
  config_android:
    text: |
      Please download the file and open it using the application https://play.google.com/store/apps/details?id=org.strongswan.android
      You will be asked for username and password which are listed below.

      Username:
      `%<username>s`

      Password:
      `%<password>s`

      (click to copy ^^)
  # --------------------------------------------------------
  config_custom:
    text: |
      *Custom Settings*

      You can connect using system setting and following credentials:

      Connection Name: `%<name>s`

      Type: `%<type>s`

      Server Host: `%<host>s`

      Server Identity: `%<host>s`

      IPSec Identifier: `%<username>s`

      Username: `%<username>s`

      Password: `%<password>s`

      CA certificate: (leave empty, not used)

      Server certificate: (leave empty, not used)
  # --------------------------------------------------------
  lang:
    text: |
      *🌎 Choose your language:*
    en: 🇬🇧 English
    ru: 🇷🇺 Русский
    tr: 🇹🇷 Türkiye
    zh: 🇨🇳 中文
    fa: 🇮🇷 فارسی
  # --------------------------------------------------------
  lang_custom:
    text: |
      *🔧 New Language*

      Please feel free to contribute us to explore more languages or fixing typos. More information is available at the page: https://github.com/KebabVPN/i18n
  # --------------------------------------------------------
  referral:
    text: |
      *💰 Referral*

      Your personal invite link is: `%<link>s`
      Click to copy and send to your friends!

      Users invited: *%<users_invited_count>s*
      Referral balance: *%<ref_balance_usd>s*
      VPN time earn rate: *%<ref_time_percent>s*
      Money earn rate: *%<ref_money_percent>s*

      Contact @Techru1 to provide your requisites for money withdrawal.
  # --------------------------------------------------------
  cabinet:
    text: |
      *👤 Personal account*

      Tap the button below to sign in. The link works once and expires in 10 minutes.
  # --------------------------------------------------------
  referral_v2:
    example: "From a %<price>s subscription you get %<reward>s."
    example_fixed: "You get %<reward>s from every payment of your client."
    friend: "Your friend gets %<bonus>s on the first payment."
    text: |
      *💰 Referral*

      Your invite link: `%<link>s`
      Your promo code: `%<code>s`
      Tap to copy and share with friends: they get a bonus on their first payment, and you earn from every payment they make.

      You get 60%% of the reward from your clients' payments, 30%% from their clients and 10%% from the third line.
      %<terms>s
      Balance: *%<available>s* available, *%<on_hold>s* on hold.

      Statistics, balance and withdrawals are in your personal account.
  # --------------------------------------------------------
  referral_v2_inactive:
    text: |
      *💰 Referral*

      The partner program opens after your first payment. Then your invite link and promo code will appear here and in your personal account.
  # --------------------------------------------------------
  promo_templates:
    text: |
      *🎟 Promo codes*

      Choose a promotion for the new codes:
  # --------------------------------------------------------
  promo_templates_empty:
    text: |
      *🎟 Promo codes*

      There are no promotions available right now. Please check back later.
  # --------------------------------------------------------
  promo_count:
    text: |
      *🎟 %<name>s*

      How many codes to create? Each code works once and does not expire.
  # --------------------------------------------------------
  promo_codes:
    text: |
      *🎟 %<name>s*

      Codes created: %<count>s

      %<codes>s

      Tap a code to copy it. All your codes and their usage are in your personal account.
  # --------------------------------------------------------
  promo_codes_file:
    text: |
      *🎟 %<name>s*

      Codes created: %<count>s. The list is in the file.
  # --------------------------------------------------------
  settings:
    text: |
      *🔧 Settings*
  # --------------------------------------------------------
  unknown:
    text: |
      Unknown command, please run /help to list all commands available!
  # --------------------------------------------------------
  promo_enter:
    text: |
      *🎟 Promo code*

      Send the promo code in one message.
  # --------------------------------------------------------
  promo_applied:
    text: |
      ✅ Promo code `%<code>s` is applied: %<bonus>s. It works when you pay by SBP or with a one-time card payment.
  # --------------------------------------------------------
  promo_current:
    text: |
      🎟 Promo code `%<code>s` is applied: %<bonus>s
  # --------------------------------------------------------
  promo:
    bonus_percent: "−%<value>s%%"
    bonus_days: "+%<count>s days"
    errors:
      not_found: "❌ There is no such promo code."
      expired: "❌ This promo code has expired."
      used_up: "❌ This promo code has already been used up."
      own_code: "❌ You can not use your own promo code."
      already_used: "❌ You have already received a promo code bonus."

    rates: "From every payment: %<r1>s for your clients, %<r2>s for your clients' clients, %<r3>s for the third line."
    rates_fixed: "You get %<r1>s of the reward from your clients' payments, %<r2>s from their clients and %<r3>s from the third line."
    text: |

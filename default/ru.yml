    text: |
      Пожалуйста, загрузите файл и откройте его с использованием приложения https://play.google.com/store/apps/details?id=org.strongswan.android
      Вам будут предложены ввести имя пользователя и пароль, которые указаны ниже.

      Имя пользователя:
      `%<username>s`

      Пароль:
      `%<password>s`

      (нажмите, чтобы скопировать ^^)
  # --------------------------------------------------------

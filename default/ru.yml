      *🔧 Новый язык*

      Пожалуйста, не стесняйтесь вносить свой вклад, чтобы изучить больше языков или исправить ошибки. Дополнительная информация доступна на странице: https://github.com/KebabVPN/i18n
  # --------------------------------------------------------
  referral:
    text: |
      *💰 Реферал*

      Ваш персональный пригласительный ссылка: `%<link>s`
      Нажмите, чтобы скопировать и отправить друзьям!

      Приглашенные пользователи: *%<users_invited_count>s*
      Баланс реферала: *%<ref_balance_usd>s*
      Ставка получения VPN-времени: *%<ref_time_percent>s*
      Ставка получения денег: *%<ref_money_percent>s*

      Свяжитесь с @KebabSupport, чтобы предоставить ваши реквизиты для вывода денег.
  # --------------------------------------------------------
  settings:
    text: |
      *🔧 Настройки*

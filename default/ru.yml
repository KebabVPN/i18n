      *Выберите вашу платформу:*

      Выберите операционную систему, которую вы хотите настроить. Вам будут предоставлены учетные данные и файлы конфигурации, необходимые для использования. Пожалуйста, будьте внимательны, так как может быть отображена чувствительная информация.
  # --------------------------------------------------------
  help:
    text: |
      *Доступные команды:*

      🏠 /start - Запустите бота и зарегистрируйтесь

      ⚙️ /config - Управление конфигурациями

      💸 /subscription - Управление вашей подпиской

      🌎 /lang - Управление языком бота

      🔧 /settings - Управление настройками

      ℹ️ /help - Получить список команд

      🤖 @KebabSupport - Получить поддержку
  # --------------------------------------------------------
  start:
    text: |
      *🌟 Добро пожаловать! 🌟*

      Благодарим вас за выбор [KebabVPN](https://kebabvpn.com). Для начала использования VPN нажмите кнопку *Конфигурации* ниже, и вы получите файл конфигурации, который нужно установить на ваше устройство. Подробное руководство доступно на https://kebabvpn.com. Все опции доступны по команде /help.
  # --------------------------------------------------------

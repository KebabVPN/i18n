      *Ваша подписка:*

      Дата окончания: *%<exp>s* %<ico>s (активных дней %<days>s)
      Проведя оплату, вы соглашаетесь с нашими [Условиями использования](https://kebabvpn.com/terms).
  # --------------------------------------------------------

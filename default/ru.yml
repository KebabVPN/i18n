    text: |
      *Ваш адрес для пополнения TRC-20*:

      `%<addr_trc20>s`
      (нажмите, чтобы скопировать)

      Депозиты в USDT рассчитываются как USD в соответствии с эффективным ценообразованием. Например, если вы хотите заплатить за 12 месяцев, просто переведите `49.99` USDT. Вы можете перевести любую сумму, которую хотите, и срок окончания подписки будет рассчитан пропорционально.

      Мы ждем *20 подтверждений* для обработки транзакции, поэтому вам придется подождать некоторое время. После обработки транзакции вы получите уведомление с подтверждением вашего депозита. Если ваш депозит не был зачислен, не стесняйтесь написать нам в @KebabSupport.
  # --------------------------------------------------------
  config:
    text: |
      *Выберите местоположение:*

      Выберите местоположение, для которого вы хотите настроить конфигурацию VPN. Вас попросят указать используемую операционную систему.
  # --------------------------------------------------------
  config_manual:
    text: |
      *Ваши учетные данные*

      Имя пользователя: `%<username>s`

      Пароль: `%<password>s`
  # --------------------------------------------------------
  config_not_found:
    text: |
      Конфигурация не найдена!
  # --------------------------------------------------------
  config_apple:
    text: |
      Пожалуйста, загрузите файл и установите его на свое устройство. После установки файла вам нужно подтвердить установку профиля в настройках системы.
  # --------------------------------------------------------

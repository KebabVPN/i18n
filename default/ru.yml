    text: |
      🌟 *Поздравляем!* 🌟

      Вы получили *%<days>s* дней использования VPN! Не стесняйтесь написать нам свой отзыв в @KebabSupport! 🫶

      Ваша подписка заканчивается: *%<exp>s*
  # --------------------------------------------------------
  sub_expired:
    text: |
      ❌ *Подписка истекла!* ❌

      Мы сожалеем об истечении срока вашей подписки *%<exp>s*

      Вам нужно выполнить команду /subscription, чтобы продолжить использование услуг.

      Пожалуйста, напишите нам в @KebabSupport, если у вас есть вопросы! 🫶
  # --------------------------------------------------------
  subscription:
    ico_yes: ✅
    ico_no: ❌
    menu:
      crypto: 🤑 USDT (TRC-20, любая сумма)
      plan_1_mo: 💵 1 мес. - 4.99 USD
      plan_12_mo: 💵 12 мес. - 49.99 USD (20% скидка)
      plan_36_mo: 💵 36 мес. - 89.99 USD (50% скидка)

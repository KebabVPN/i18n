  platforms:
    text: |
      *Выберите вашу платформу:*

      Выберите операционную систему для настройки. Вам будут предоставлены учетные данные и файлы конфигурации, необходимые для использования. Пожалуйста, будьте внимательны, так как может отображаться чувствительная информация.
  # --------------------------------------------------------
  help:
    text: |
      *Доступные команды:*

      🏠 /start - Запустить бота и зарегистрироваться

      ⚙️ /config - Управление настройками

      💸 /subscription - Управление подпиской

      🌎 /lang - Управление языком бота

      🔧 /settings - Управление настройками

      ℹ️ /help - Получить список команд

      🤖 @botstorm - Получить поддержку
  # --------------------------------------------------------
  start:
    text: |
      *🌟 Добро пожаловать! 🌟*

      Добро пожаловать в TBCC VPN – вашего надежного спутника в мире онлайн-безопасности и анонимности! Мы благодарим вас за выбор, и наша команда готова предоставить вам безопасное сетевое соединение.

      Для начала использования VPN просто нажмите кнопку 'Настройки' ниже, чтобы получить файл конфигурации, который нужно установить на вашем устройстве. Подробные инструкции доступны на нашем веб-сайте по адресу https://tbccvpn.com. Все опции также доступны с помощью команды /help.

      Спасибо, что выбрали TBCC VPN. Мы гордимся тем, что обеспечиваем безопасное и анонимное онлайн-путешествие!
  sub_extended:
    text: |
      🌟 *Поздравляем!* 🌟

      У вас есть *%<days>s* дней использования VPN! Не стесняйтесь отправить нам свой отзыв в @botstorm! 🫶

      Ваша подписка истекает: *%<exp>s*
  # --------------------------------------------------------
  sub_expired:
    text: |
      ❌ *Подписка истекла!* ❌

      Мы сожалеем об истечении вашей подписки *%<exp>s*

      Вам нужно выполнить команду /subscription, чтобы продолжить использование услуг.

      Если у вас есть вопросы, напишите нам в @botstorm! 🫶
  # --------------------------------------------------------
  subscription:
    ico_yes: ✅
    ico_no: ❌
    menu:
      crypto: 🤑 USDT (TRC-20, любая сумма)
      plan_1_mo: 💵 1 мес. - 4.99 USD
      plan_12_mo: 💵 12 мес. - 49.99 USD (20% скидка)
      plan_36_mo: 💵 36 мес. - 89.99 USD (50% скидка)
    text: |
      *Ваша подписка:*

      Дата истечения: *%<exp>s* %<ico>s (%<days>s активных дней)
      Совершая платеж, вы соглашаетесь с нашими Условиями использования.
  # --------------------------------------------------------
  payment_options:
    menu:
      pm_stripe_payment: 💳 Карта, WeChat, Alipay, ApplePay, GPay
      pm_stripe_subscription: 💳 Карта (подписка)
      pm_pay2day: 🇷🇺 СБП (RUB)
    text: |
      *Ваша подписка:*

      Дата истечения: *%<exp>s* %<ico>s (%<days>s активных дней)
      Совершая платеж, вы соглашаетесь с нашими Условиями использования.

      Вы покупаете: *%<description>s*

      Пожалуйста, выберите метод оплаты:
  # --------------------------------------------------------
  plan_unknown:
    text: |
      План отключен или неизвестен! Запустите команду /subscription, чтобы узнать доступные для покупки планы.
  # --------------------------------------------------------
  sub_crypto:
    text: |
      *Ваш адрес для пополнения USDT (TRC-20)*:

      `%<addr_trc20>s`
      (нажмите, чтобы скопировать)

      Депозиты в USDT рассчитываются как в USD с учетом текущих цен. Например, если вы хотите оплатить подписку на 12 месяцев, просто переведите `49.99` USDT. Вы можете перевести любую сумму, и дата окончания подписки будет рассчитана пропорционально.

      Мы ждем *20 подтверждений* для обработки транзакции, поэтому вам придется подождать некоторое время. Как только транзакция будет обработана, вы получите уведомление с подтверждением вашего депозита. Если ваш депозит не зачислен, не стесняйтесь написать нам в @botstorm.
  # --------------------------------------------------------
  config:
    text: |
      *Выберите местоположение:*

      Пожалуйста, выберите местоположение, для которого вы хотите настроить конфигурацию VPN. Вам будет предложено выбрать операционную систему, которую вы используете.
  # --------------------------------------------------------
  config_manual:
    text: |
      *Ваши учетные данные*

      Имя пользователя: `%<username>s`

      Пароль: `%<password>s`
  # --------------------------------------------------------
  config_not_found:
    text: |
      Конфигурация не найдена!
  # --------------------------------------------------------
  config_apple:
    text: |
      Пожалуйста, загрузите файл и установите его на свое устройство. После установки файла вам нужно подтвердить установку профиля в настройках системы.
  # --------------------------------------------------------
  config_android:
    text: |
      Пожалуйста, загрузите файл и откройте его с использованием приложения https://download.strongswan.org/Android/strongSwan-2.4.2.apk
      Вам будет предложено ввести имя пользователя и пароль, которые указаны ниже.

      Имя пользователя:
      `%<username>s`

      Пароль:
      `%<password>s`

      (нажмите, чтобы скопировать ^^)
  # --------------------------------------------------------
  config_custom:
    text: |
      *Настройки по умолчанию*

      Вы можете подключиться, используя системные настройки и следующие учетные данные:

      Имя подключения: `%<name>s`

      Тип: `%<type>s`

      Хост сервера: `%<host>s`

      Идентификатор сервера: `%<host>s`

      Идентификатор IPSec: `%<username>s`

      Имя пользователя: `%<username>s`

      Пароль: `%<password>s`

      CA-сертификат: (оставьте пустым, не используется)

      Сертификат сервера: (оставьте пустым, не используется)
  # --------------------------------------------------------
  lang:
    text: |
      *🌎 Выберите свой язык:*
    en: 🇬🇧 English
    ru: 🇷🇺 Русский
    tr: 🇹🇷 Türkiye
    zh: 🇨🇳 中文
    fa: 🇮🇷 فارسی
  # --------------------------------------------------------
  lang_custom:
    text: |
      *🔧 Новый язык*

      Пожалуйста, не стесняйтесь внести свой вклад в исследование новых языков или исправление ошибок. Более подробная информация доступна на странице: https://github.com/KebabVPN/i18n
  # --------------------------------------------------------
  referral:
    text: |
      *💰 Реферал*

      Ваша персональная пригласительная ссылка: `%<link>s`
      Нажмите, чтобы скопировать и отправить друзьям!

      Приглашенные пользователи: *%<users_invited_count>s*
      Баланс по рефералам: *%<ref_balance_usd>s*
      Скорость заработка времени VPN: *%<ref_time_percent>s*
      Скорость заработка денег: *%<ref_money_percent>s*

      Свяжитесь с @botstorm, чтобы предоставить реквизиты для вывода средств.
  # --------------------------------------------------------
  settings:
    text: |
      *🔧 Настройки*
  # --------------------------------------------------------
  unknown:
    text: |
      Неизвестная команда, выполните /help, чтобы получить список всех доступных команд!
